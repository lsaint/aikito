name: Windows CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv pip install --system pytest pytest-xdist

      - name: Run unit tests
        run: python -m pytest -n auto

  windows-smoke-test:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Windows CLI Help and Version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m aikito --help
          python -m aikito version
          python -m aikito version --help
          python -m aikito version --json
          python -m aikito git --help
          python -m aikito rm subagent --help
          python -m aikito rm mcp --help
          python -m aikito invalid-subcommand 2>$null
          if ($LASTEXITCODE -eq 0) { throw "aikito did not propagate non-zero exit code on invalid subcommand" }
          $global:LASTEXITCODE = 0

      - name: Install and verify Windows console script entrypoint
        shell: pwsh
        env:
          PYTHONPATH: ""
        run: |
          $winVenv = Join-Path $env:RUNNER_TEMP "win-venv"
          python -m venv $winVenv
          $venvPip = Join-Path $winVenv "Scripts\pip.exe"
          $venvAikito = Join-Path $winVenv "Scripts\aikito.exe"
          & $venvPip install .
          & $venvAikito --help
          & $venvAikito version

      - name: Test PowerShell Completion Generator and Loading
        shell: pwsh
        run: |
          $compScript = python -m aikito completion powershell
          Invoke-Expression ($compScript | Out-String)
          python -m aikito completion candidates projects
          python -m aikito completion candidates skills
          python -m aikito completion candidates memories

      - name: Test Workspace Init, Global Sync and Doctor on Windows
        shell: pwsh
        run: |
          $wsDir = Join-Path $env:RUNNER_TEMP "aikito-ws"
          $piDir = Join-Path $HOME ".pi\agent"
          $codexDir = Join-Path $HOME ".codex"
          $claudeDir = Join-Path $HOME ".claude"
          $agyMarkerDir = Join-Path $HOME ".gemini\config"
          $copilotDir = Join-Path $HOME ".copilot"
          $dshDir = Join-Path $HOME ".dsh"
          $grokDir = Join-Path $HOME ".grok"
          $opencodeDir = Join-Path $HOME ".config\opencode"
          New-Item -ItemType Directory -Force -Path $piDir | Out-Null
          New-Item -ItemType Directory -Force -Path $codexDir | Out-Null
          New-Item -ItemType Directory -Force -Path $claudeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $agyMarkerDir | Out-Null
          New-Item -ItemType Directory -Force -Path $copilotDir | Out-Null
          New-Item -ItemType Directory -Force -Path $dshDir | Out-Null
          New-Item -ItemType Directory -Force -Path $grokDir | Out-Null
          New-Item -ItemType Directory -Force -Path $opencodeDir | Out-Null
          $env:AIKITO_DIR = $wsDir
          $initOutput = python -m aikito init workspace "$wsDir"
          $initOutput | Write-Output
          $initOutput | Select-String "Run 'aikito sync'"
          $gitStatus = python -m aikito git status
          $gitStatus | Select-String "On branch"
          $adoptionReference = Join-Path $wsDir "skills\aikito\references\adoption.md"
          $installationReference = Join-Path $wsDir "skills\aikito\references\installation.md"
          $projectsReference = Join-Path $wsDir "skills\aikito\references\projects.md"
          if (-not (Test-Path $adoptionReference)) { throw "Adoption skill reference missing" }
          if (-not (Test-Path $installationReference)) { throw "Installation skill reference missing" }
          if (-not (Test-Path $projectsReference)) { throw "Projects skill reference missing" }
          $connectOutput = python -m aikito init workspace "$wsDir"
          $connectOutput | Write-Output
          $connectOutput | Select-String "\[CONNECTED\]"
          $connectOutput | Select-String "aikito doctor"
          $claudeAgents = Join-Path $claudeDir "agents"
          New-Item -ItemType Directory -Force -Path $claudeAgents | Out-Null
          $adoptSource = Join-Path $claudeAgents "ci-adopt.md"
          @("---", "name: ci-adopt", "description: CI adoption smoke test", "---", "Review adoption behavior.") | Set-Content $adoptSource
          python -m aikito adopt --dry-run --verbose --skip subagent/ci-adopt
          $adoptedSubagent = Join-Path $wsDir "subagents\ci-adopt.md"
          if (Test-Path $adoptedSubagent) { throw "Dry-run wrote adopted subagent" }
          python -m aikito doctor --no-color | Select-String "Adoption"
          python -m aikito adopt
          if (-not (Test-Path $adoptedSubagent)) { throw "Default adopt did not write subagent" }
          python -m aikito rm subagent ci-adopt
          Remove-Item -Force $adoptSource -ErrorAction SilentlyContinue
          $codexConfig = Join-Path $codexDir "config.toml"
          @('[mcp_servers.openaiDeveloperDocs]', 'url = "https://developers.openai.com/mcp"') | Set-Content $codexConfig
          $builtinOutput = python -m aikito adopt --dry-run --verbose | Out-String
          if ($builtinOutput -notmatch "\[SKIP MCP\] Server 'openaiDeveloperDocs' is built-in to codex") {
            throw "Adopt did not report the Codex built-in MCP server"
          }
          $builtinTarget = Join-Path $wsDir "mcps\openaiDeveloperDocs.toml"
          if (Test-Path $builtinTarget) { throw "Adopt imported the Codex built-in MCP server" }
          $syncPlan = python -m aikito sync --dry-run
          $syncPlan | Write-Output
          $syncPlan | Select-String "Sync plan"
          $syncPlan | Select-String "Safe to apply"
          python -m aikito sync --dry-run --verbose | Select-String "Details"
          $syncGlobalOutput = python -m aikito sync global | Out-String
          $syncGlobalOutput | Write-Host
          if ($syncGlobalOutput -notmatch "3 Agent skill entries across 8 consumers") {
            throw "Global sync output did not match expected consumer pattern"
          }
          if ($syncGlobalOutput -notmatch "skills: shared path") {
            throw "Global sync output did not report shared target deduplication"
          }
          if (-not (Test-Path (Join-Path $HOME ".agents\skills\aikito"))) {
            throw "Global aikito skill link missing"
          }
          if (-not (Test-Path (Join-Path $HOME ".agents\skills\durable-memory"))) {
            throw "Global durable-memory skill link missing"
          }
          if (-not (Test-Path (Join-Path $HOME ".claude\skills"))) {
            throw "Claude skills consumer link missing"
          }
          if (-not (Test-Path (Join-Path $HOME ".gemini\antigravity-cli\skills"))) {
            throw "Antigravity skills consumer link missing"
          }
          if (-not (Test-Path (Join-Path $HOME ".claude\CLAUDE.md"))) {
            throw "Claude instructions consumer link missing"
          }
          if (-not (Test-Path (Join-Path $HOME ".codex\AGENTS.md"))) {
            throw "Codex instructions consumer link missing"
          }
          # Verify Phase 4 idempotency: repeat sync global must be NOOP (no writes / no recreations)
          $repeatOutput = python -m aikito sync global | Out-String
          if ($repeatOutput -match "\[LINK\]" -or $repeatOutput -match "\[UNLINK\]") {
            throw "Repeated global sync was not idempotent on Windows"
          }
          if ($repeatOutput -notmatch "Global resources synced successfully") {
            throw "Repeated global sync did not report success"
          }
          if (-not (Test-Path (Join-Path $HOME ".claude\CLAUDE.md"))) {
            throw "Claude instructions consumer link missing after repeat"
          }
          if (-not (Test-Path (Join-Path $HOME ".codex\AGENTS.md"))) {
            throw "Codex instructions consumer link missing after repeat"
          }

          # Verify Phase 4 dry-run zero write snapshot
          $dryHome = Join-Path $env:RUNNER_TEMP "win-dry-home"
          New-Item -ItemType Directory -Force -Path $dryHome | Out-Null
          $origHome = $env:HOME
          $origProfile = $env:USERPROFILE
          $env:HOME = $dryHome
          $env:USERPROFILE = $dryHome
          python -m aikito sync global --dry-run | Out-Null
          if (Test-Path (Join-Path $dryHome ".agents")) {
            throw "Dry-run created .agents container on Windows"
          }
          $env:HOME = $origHome
          $env:USERPROFILE = $origProfile
          Get-ChildItem -Path (Join-Path $wsDir "skills") -Filter "*.md" -Recurse | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $crlfText = $text.Replace("`r`n", "`n").Replace("`n", "`r`n")
            [System.IO.File]::WriteAllText($_.FullName, $crlfText)
          }
          $crlfStatusError = Join-Path $env:RUNNER_TEMP "bundled-skill-crlf.err"
          python -m aikito status 2> $crlfStatusError | Out-Null
          if (Select-String -Path $crlfStatusError -Pattern "Bundled skill snapshot differs") {
            $errContent = Get-Content $crlfStatusError -Raw
            throw "Status reported divergent bundled skills due to CRLF line endings: $errContent"
          }
          $aikitoSkill = Join-Path $wsDir "skills\aikito\SKILL.md"
          $memorySkill = Join-Path $wsDir "skills\durable-memory\SKILL.md"
          "customized aikito" | Set-Content $aikitoSkill
          "customized memory" | Set-Content $memorySkill
          $statusError = Join-Path $env:RUNNER_TEMP "bundled-skill-notice.err"
          python -m aikito status 2> $statusError | Out-Null
          if (-not (Select-String -Path $statusError -Pattern "Bundled skill snapshot differs")) {
            $errContent = Get-Content $statusError -Raw
            throw "Status did not report divergent bundled skills: $errContent"
          }
          $refreshOutput = python -m aikito sync global | Out-String
          if ($refreshOutput -notmatch "\[REFRESH\] Bundled skill 'aikito'") {
            throw "Aikito skill was not refreshed"
          }
          if ($refreshOutput -notmatch "\[REFRESH\] Bundled skill 'durable-memory'") {
            throw "Durable memory skill was not refreshed"
          }
          if ((Get-Content $aikitoSkill -Raw) -ne (Get-Content "src\aikito\templates\skills\aikito\SKILL.md" -Raw)) {
            throw "Aikito skill does not match the installed template"
          }
          if ((Get-Content $memorySkill -Raw) -ne (Get-Content "src\aikito\templates\skills\durable-memory\SKILL.md" -Raw)) {
            throw "Durable memory skill does not match the installed template"
          }
          $backupRoot = Join-Path $HOME ".aikito\backups"
          if (-not (Get-ChildItem $backupRoot -Recurse -Filter "SKILL.md" | Where-Object { $_.FullName -match "bundled-skills_" })) {
            throw "Bundled skill backup was not created"
          }
          $projectDir = Join-Path $env:RUNNER_TEMP "example-project"
          New-Item -ItemType Directory -Force -Path $projectDir | Out-Null
          python -m aikito init project example "$projectDir"

          # Phase 5 Project instructions smoke tests on Windows
          $winInstCanonical = Join-Path $wsDir "projects\example\AGENTS.md"
          $winInstTarget = Join-Path $projectDir "AGENTS.md"
          # 1. Non-empty canonical creates instruction link
          Set-Content -Path $winInstCanonical -Value "# Windows Project Instructions"
          python -m aikito sync project example
          if (-not (Test-Path $winInstTarget)) {
            throw "Project instruction link missing on Windows"
          }
          # 2. Repeated sync is idempotent
          $repeatProjOutput = python -m aikito sync project example | Out-String
          if ($repeatProjOutput -match "\[LINK\]" -or $repeatProjOutput -match "\[UNLINK\]") {
            throw "Repeated project instruction sync was not idempotent on Windows"
          }
          # 3. Empty canonical removes exact owned symlink (INV-INST-08)
          Set-Content -Path $winInstCanonical -Value ""
          python -m aikito sync project example
          if (Test-Path $winInstTarget) {
            throw "Empty canonical did not unlink owned instruction symlink on Windows"
          }
          # 4. Project-owned regular file at instruction target is preserved under empty canonical (INV-INST-10)
          Set-Content -Path $winInstTarget -Value "user regular instruction file"
          python -m aikito sync project example
          if (-not (Test-Path $winInstTarget)) {
            throw "Project-owned regular instruction file was deleted under empty canonical on Windows"
          }
          # 5. Regular file at instruction target causes conflict when canonical is enabled (INV-INST-03)
          Set-Content -Path $winInstCanonical -Value "# Enabled Instructions Again"
          $conflictOutput = python -m aikito sync project example 2>&1 | Out-String
          if ($conflictOutput -notmatch "\[CONFLICT\]") {
            throw "Pre-existing regular file at instruction target did not cause CONFLICT on Windows"
          }
          Remove-Item -Force $winInstTarget
          # Re-sync to leave clean link for remainder of test
          python -m aikito sync project example

          # Phase 6 Project memory smoke tests on Windows
          $winMemCanonical = Join-Path $wsDir "projects\example\memory\notes"
          New-Item -ItemType Directory -Force -Path $winMemCanonical | Out-Null
          $winMemTarget = Join-Path $projectDir ".agents\memory\notes"
          python -m aikito sync project example
          if (-not (Test-Path $winMemTarget)) {
            throw "Project memory notes link missing on Windows"
          }
          # Repeated sync is idempotent
          $repeatMemOutput = python -m aikito sync project example | Out-String
          if ($repeatMemOutput -match "\[LINK\].*memory" -or $repeatMemOutput -match "\[UNLINK\].*memory") {
            throw "Repeated project memory sync was not idempotent on Windows"
          }
          $extSkillDir = Join-Path $env:RUNNER_TEMP "external-windows-skill"
          New-Item -ItemType Directory -Force -Path $extSkillDir | Out-Null
          @("---", "name: win-imported-skill", "description: Windows imported skill", "---", "", "# Windows Skill") | Set-Content (Join-Path $extSkillDir "SKILL.md")
          "obsolete" | Set-Content (Join-Path $extSkillDir "obsolete.txt")
          python -m aikito add skill --from "$extSkillDir" --project example --sync
          if (-not (Test-Path (Join-Path $wsDir "skills\win-imported-skill\SKILL.md"))) {
            throw "Imported canonical skill file is missing on Windows"
          }
          if (-not (Test-Path (Join-Path $projectDir ".agents\skills\win-imported-skill"))) {
            throw "Synchronized project skill link is missing on Windows"
          }
          @("---", "name: win-imported-skill", "description: Updated Windows skill", "---", "", "# Updated Windows Skill") | Set-Content (Join-Path $extSkillDir "SKILL.md")
          Remove-Item (Join-Path $extSkillDir "obsolete.txt")
          "added" | Set-Content (Join-Path $extSkillDir "added.txt")
          python -m aikito add skill --from "$extSkillDir" --project example --force --sync
          $canonicalSkill = Join-Path $wsDir "skills\win-imported-skill"
          if (-not (Select-String -Path (Join-Path $canonicalSkill "SKILL.md") -Pattern "# Updated Windows Skill" -Quiet)) {
            throw "Imported canonical skill was not refreshed on Windows"
          }
          if (Test-Path (Join-Path $canonicalSkill "obsolete.txt")) {
            throw "Removed source file survived the Windows snapshot refresh"
          }
          if (-not (Test-Path (Join-Path $canonicalSkill "added.txt"))) {
            throw "New source file is missing after the Windows snapshot refresh"
          }
          python -m aikito rm skill win-imported-skill --project example --sync
          if (-not (Test-Path (Join-Path $canonicalSkill "SKILL.md"))) {
            throw "Canonical skill was deleted when only unregistering from project on Windows"
          }
          if (Test-Path (Join-Path $projectDir ".agents\skills\win-imported-skill")) {
            throw "Project skill runtime was not cleaned up after unregistering on Windows"
          }
          python -m aikito rm skill win-imported-skill
          if (Test-Path $canonicalSkill) {
            throw "Canonical skill directory was not deleted after global removal on Windows"
          }
          $extPrompt = Join-Path $env:TEMP "win-reviewer.md"
          @("---", "name: win-reviewer", "description: Win Reviewer", 'agents: ["claude-code"]', "---", "# Win Reviewer", "Prompt content") | Set-Content $extPrompt
          python -m aikito add subagent --from $extPrompt
          $winSubFile = Join-Path $wsDir "subagents\win-reviewer.md"
          if (-not (Test-Path $winSubFile)) { throw "Win reviewer markdown missing" }
          @("---", "description: Win Reviewer Updated", "---", "# Win Reviewer", "Updated prompt content") | Set-Content $extPrompt
          python -m aikito add subagent win-reviewer --from $extPrompt --force
          python -m aikito rm subagent win-reviewer
          if (Test-Path $winSubFile) { throw "Win reviewer markdown was not deleted after rm" }
          python -m aikito add mcp win-mcp --url "https://example.com/mcp"
          $winMcpFile = Join-Path $wsDir "mcps\win-mcp.toml"
          if (-not (Test-Path $winMcpFile)) { throw "Win MCP toml missing" }
          python -m aikito rm mcp win-mcp
          if (Test-Path $winMcpFile) { throw "Win MCP toml was not deleted after rm" }
          # Test rm mcp with --force flag
          python -m aikito add mcp win-force-mcp --url "https://example.com/force"
          $winForceMcpFile = Join-Path $wsDir "mcps\win-force-mcp.toml"
          if (-not (Test-Path $winForceMcpFile)) { throw "Win force MCP toml missing" }
          python -m aikito rm mcp win-force-mcp --force
          if (Test-Path $winForceMcpFile) { throw "Win force MCP toml was not deleted after rm --force" }
          # Test add mcp with --from and --force
          $extMcpJson = Join-Path $wsDir "ext-mcp.json"
          @('{"url": "https://example.com/win-imported"}') | Set-Content $extMcpJson
          python -m aikito add mcp win-imported --from $extMcpJson
          $winImportedFile = Join-Path $wsDir "mcps\win-imported.toml"
          if (-not (Test-Path $winImportedFile)) { throw "Win imported MCP toml missing" }
          @('{"url": "https://example.com/win-imported-v2"}') | Set-Content $extMcpJson
          python -m aikito add mcp win-imported --from $extMcpJson --force
          python -m aikito rm mcp win-imported
          if (Test-Path $winImportedFile) { throw "Win imported MCP toml was not deleted after rm" }

          # Phase 7 Subagent and MCP runtime synchronization smoke tests on Windows
          python -m aikito add subagent win-p7-sub --description "Windows Phase 7 subagent"
          $winP7SubFile = Join-Path $wsDir "subagents\win-p7-sub.md"
          if (-not (Test-Path $winP7SubFile)) { throw "Windows Phase 7 subagent file missing" }
          python -m aikito sync subagents
          $claudeSubTarget = Join-Path $claudeDir "agents\win-p7-sub.md"
          if (-not (Test-Path $claudeSubTarget)) { throw "Windows synchronized subagent target missing" }
          # Repeat sync is NOOP idempotency
          $subRepeat = python -m aikito sync subagents | Out-String
          if ($subRepeat -notmatch "\[OK\] claude-code/win-p7-sub") { throw "Repeated subagent sync was not NOOP on Windows" }

          python -m aikito add mcp win-p7-mcp --url "https://example.com/win-p7"
          $winP7McpToml = Join-Path $wsDir "mcps\win-p7-mcp.toml"
          if (-not (Test-Path $winP7McpToml)) { throw "Windows Phase 7 MCP toml missing" }
          python -m aikito sync mcp
          if (-not (Select-String -Path $codexConfig -Pattern "win_p7_mcp" -Quiet)) {
            throw "Windows synchronized MCP not written to codex config"
          }
          # Repeat sync is NOOP idempotency
          $mcpRepeat = python -m aikito sync mcp | Out-String
          if ($mcpRepeat -notmatch "already synchronized") { throw "Repeated MCP sync was not NOOP on Windows" }

          # Runtime drift blocks without --force
          $codexContent = Get-Content -Raw -Path $codexConfig
          $codexTampered = $codexContent.Replace("https://example.com/win-p7", "https://example.com/tampered")
          Set-Content -Path $codexConfig -Value $codexTampered
          $mcpDrift = python -m aikito sync mcp 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "Expected MCP sync to fail on runtime drift" }
          if ($mcpDrift -notmatch "\[CONFLICT\]") { throw "MCP runtime drift was not detected on Windows" }

          # Desired Absent removal via unified engine
          python -m aikito rm mcp win-p7-mcp --force --sync
          if (Test-Path $winP7McpToml) { throw "Windows Phase 7 MCP toml was not deleted" }
          if (Select-String -Path $codexConfig -Pattern "win_p7_mcp" -Quiet) {
            throw "Windows Phase 7 MCP was not removed from codex config"
          }
          python -m aikito rm subagent win-p7-sub --sync
          if (Test-Path $claudeSubTarget) { throw "Windows Phase 7 subagent target was not cleaned up" }
          $globalNote = Join-Path $wsDir "memory\notes\windows-memory.md"
          @("# Windows Memory") | Set-Content $globalNote
          $projectNote = Join-Path $wsDir "projects\example\memory\notes\windows-project-memory.md"
          @("# Windows Project Memory") | Set-Content $projectNote
          $globalIndex = Join-Path $wsDir "memory\index.md"
          @("# Legacy Index", "- [[windows-memory|Windows Memory]]") | Set-Content $globalIndex
          $projectIndex = Join-Path $wsDir "projects\example\memory\index.md"
          @("# Legacy Project Index", "- [[windows-project-memory|Windows Project Memory]]") | Set-Content $projectIndex
          python -m aikito show memory windows-memory | Select-String "Windows Memory"
          python -m aikito show memory windows-project-memory --project example | Select-String "Windows Project Memory"
          $env:EDITOR = 'python -c "import sys"'
          python -m aikito edit memory global/index
          if ($LASTEXITCODE -eq 0) {
            throw "Editing a legacy memory index unexpectedly succeeded"
          }
          if (Test-Path (Join-Path $wsDir "index.md")) {
            throw "Editing a memory index created a fake workspace index"
          }
          $malformedNote = Join-Path $wsDir "memory\notes\windows-malformed.md"
          @("# Windows Malformed Memory") | Set-Content $malformedNote
          $syncError = Join-Path $env:RUNNER_TEMP "windows-memory-sync.err"
          python -m aikito sync global 2> $syncError
          if ($LASTEXITCODE -ne 0) {
            throw "Global sync failed because of malformed memory"
          }
          if ((Get-Item $syncError).Length -ne 0) {
            throw "Global sync emitted an unexpected memory warning"
          }
          if (Select-String -Path $malformedNote -Pattern "category:") {
            throw "Global sync unexpectedly modified canonical memory"
          }
          python -m aikito rm memory windows-malformed
          if (Test-Path $malformedNote) {
            throw "Malformed target memory note was not removed"
          }
          python -c "from aikito import Project; prepared = Project.load('example').prepare(agent='pi'); assert prepared.name == 'example'"
          if (-not (Test-Path (Join-Path $projectDir ".agents\memory\notes"))) {
            throw "Prepared project memory link is missing"
          }
          if (Test-Path (Join-Path $projectDir ".agents\memory\index.md")) {
            throw "Legacy project memory index was synchronized"
          }
          $secondProjectDir = Join-Path $env:RUNNER_TEMP "example-project-second"
          New-Item -ItemType Directory -Force -Path $secondProjectDir | Out-Null
          $env:AIKITO_TEST_PROJECT_PATH = $secondProjectDir
          python -c "import os; from pathlib import Path; from aikito import Project; prepared = Project.load('example').prepare(agent='pi', path=os.environ['AIKITO_TEST_PROJECT_PATH']); assert prepared.cwd == Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve()"
          if (-not (Test-Path (Join-Path $secondProjectDir ".agents\memory\notes"))) {
            throw "Prepared explicit project path memory link is missing"
          }
          $thirdProjectDir = Join-Path $env:RUNNER_TEMP "example-project-third"
          New-Item -ItemType Directory -Force -Path $thirdProjectDir | Out-Null
          $env:AIKITO_TEST_PROJECT_PATH = $thirdProjectDir
          python -c "import os; from pathlib import Path; from aikito import Project; updated = Project.load('example').add_path(os.environ['AIKITO_TEST_PROJECT_PATH']); assert Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve() in updated.paths"
          $nestedNotes = Join-Path $wsDir "memory\notes\nested"
          New-Item -ItemType Directory -Force -Path $nestedNotes | Out-Null
          @("# Hidden nested note") | Set-Content (Join-Path $nestedNotes "hidden.md")
          $doctorOutput = python -m aikito doctor --no-color | Out-String
          if ($doctorOutput -notmatch "memory notes subdirectory 'nested/' is not scanned") {
            throw "Doctor did not report the nested memory note directory"
          }
          Remove-Item -Recurse $nestedNotes
          python -m aikito status
          python -m aikito show memory --project example
          # Verify show project Fix: and doctor sync hints on missing runtime notes
          $runtimeNotes = Join-Path $projectDir ".agents\memory\notes"
          Remove-Item $runtimeNotes
          $showProjOutput = python -m aikito show project example | Out-String
          if ($showProjOutput -notmatch "Fix:.*aikito sync project example") {
            throw "show project did not display expected Fix hint"
          }
          $doctorProjOutput = python -m aikito doctor --no-color | Out-String
          if ($doctorProjOutput -notmatch "aikito sync project example") {
            throw "doctor did not display expected aikito sync project hint"
          }
          python -m aikito sync project example | Out-Null
          if (-not (Test-Path $runtimeNotes)) {
            throw "runtime notes link was not restored by sync"
          }
          # Verify conflict marker detection in memory notes (Scenario 1: MD only)
          $conflictNote = Join-Path $wsDir "memory\notes\ci-conflict.md"
          @("# Conflicted Note", "<<<<<<< HEAD", "version A", "=======", "version B", ">>>>>>> branch") | Set-Content $conflictNote
          $conflictOutput = python -m aikito doctor --no-color | Out-String
          if ($conflictOutput -notmatch "Git conflict marker detected") {
            throw "Doctor did not report Git conflict markers in memory note"
          }
          # doctor --fix must NOT modify the conflicted file
          $conflictBefore = Get-Content $conflictNote -Raw
          python -m aikito doctor --fix --no-color | Out-Null
          $conflictAfter = Get-Content $conflictNote -Raw
          if ($conflictBefore -ne $conflictAfter) {
            throw "doctor --fix modified conflicted memory note"
          }
          Remove-Item $conflictNote

          # Scenario 2: TOML conflict only (no conflicted note)
          $skillsToml = Join-Path $wsDir "skills.toml"
          $skillsBefore = Get-Content $skillsToml -Raw
          @("<<<<<<< HEAD", 'skills = ["a"]', "=======", 'skills = ["b"]', ">>>>>>> branch") | Set-Content $skillsToml
          $tomlConflictOutput = python -m aikito doctor --no-color | Out-String
          if ($tomlConflictOutput -notmatch "skills.toml") {
            throw "Doctor did not mention skills.toml for TOML conflict"
          }
          if ($tomlConflictOutput -notmatch "Git conflict marker detected") {
            throw "Doctor did not report Git conflict markers in skills.toml"
          }
          if ($tomlConflictOutput -match "TOML parse error") {
            throw "Doctor reported duplicate TOML parse error for conflicted TOML"
          }
          # doctor --fix must NOT modify the conflicted TOML file
          $tomlBefore = Get-Content $skillsToml -Raw
          python -m aikito doctor --fix --no-color | Out-Null
          $tomlAfter = Get-Content $skillsToml -Raw
          if ($tomlBefore -ne $tomlAfter) {
            throw "doctor --fix modified conflicted TOML file"
          }
          # Restore clean skills.toml
          Set-Content $skillsToml $skillsBefore

          # Verify sync and prepare conflict pre-check on Windows
          $exampleAgents = Join-Path $wsDir "projects\example\AGENTS.md"
          $origAgents = Get-Content $exampleAgents -Raw
          @("# Conflicted instructions", "<<<<<<< HEAD", "rule A", "=======", "rule B", ">>>>>>> branch") | Set-Content $exampleAgents

          # Project.prepare() must fail with ProjectPrepareConflictError
          $exampleProjDir = Join-Path $env:RUNNER_TEMP "example-project"
          $env:AIKITO_SMOKE_PROJ_PATH = $exampleProjDir
          python -c "
          import os
          from aikito import Project, ProjectPrepareConflictError
          try:
              Project.load('example').prepare(agent='pi', path=os.environ['AIKITO_SMOKE_PROJ_PATH'])
              raise AssertionError('prepare() did not raise ProjectPrepareConflictError')
          except ProjectPrepareConflictError as exc:
              assert 'Git conflict marker detected' in str(exc)
          "

          # CLI sync project must fail and report conflict
          $projSyncOutput = python -m aikito sync project example 2>&1 | Out-String
          if ($projSyncOutput -notmatch "Git conflict marker detected") {
            throw "Expected sync project to report Git conflict marker detected"
          }

          # Unrelated global sync must succeed despite project conflict
          python -m aikito sync global

          # Restore clean project instructions
          Set-Content $exampleAgents $origAgents

      - name: Project Skill Sync Engine on Windows (copy mode, idempotency, drift vs update, force, deselection)
        shell: pwsh
        run: |
          $wsDir = Join-Path $env:RUNNER_TEMP "aikito-ws"
          $env:AIKITO_DIR = $wsDir
          $p2ProjDir = Join-Path $env:RUNNER_TEMP "win-copy-proj"
          New-Item -ItemType Directory -Force -Path $p2ProjDir | Out-Null

          # Initialize project and switch to copy mode
          python -m aikito init project win-copy "$p2ProjDir"
          $p2Config = Join-Path $wsDir "projects\win-copy\agent.toml"
          $configContent = (Get-Content $p2Config -Raw) -replace 'sync_mode = "link"', 'sync_mode = "copy"'
          Set-Content -Path $p2Config -Value $configContent

          # 1. Add skill and first-time sync
          python -m aikito add skill win-copy-skill --description "Windows Copy Skill" --project win-copy
          $canonicalSkill = Join-Path $wsDir "skills\win-copy-skill"
          @("canonical v1") | Set-Content (Join-Path $canonicalSkill "SKILL.md")

          # Dry run preview check
          $dryOutput = python -m aikito sync project win-copy --dry-run | Out-String
          if ($dryOutput -notmatch "\[DRY RUN COPY\]") {
            throw "Expected dry run to preview copy operation"
          }
          $runtimeSkill = Join-Path $p2ProjDir ".agents\skills\win-copy-skill"
          if (Test-Path $runtimeSkill) {
            throw "Dry run unexpectedly created runtime skill directory"
          }

          # Real first-time sync
          python -m aikito sync project win-copy
          if (-not (Test-Path $runtimeSkill)) {
            throw "Runtime skill directory missing after first sync"
          }
          $runtimeSkillMd = Join-Path $runtimeSkill "SKILL.md"
          if (-not (Test-Path $runtimeSkillMd)) {
            throw "Runtime SKILL.md missing after first sync"
          }
          $content = Get-Content $runtimeSkillMd -Raw
          if ($content -notmatch "canonical v1") {
            throw "Runtime SKILL.md content mismatch"
          }

          # 2. Idempotent repeated sync (zero writes / mtime invariance)
          $mtimeBefore = (Get-Item $runtimeSkillMd).LastWriteTimeUtc.Ticks
          python -m aikito sync project win-copy
          $mtimeAfter = (Get-Item $runtimeSkillMd).LastWriteTimeUtc.Ticks
          if ($mtimeBefore -ne $mtimeAfter) {
            throw "Repeated sync modified mtime on Windows (before=$mtimeBefore, after=$mtimeAfter)"
          }

          # 3. Canonical upstream update without --force (R == B != C)
          @("canonical v2") | Set-Content (Join-Path $canonicalSkill "SKILL.md")
          python -m aikito sync project win-copy
          $updatedContent = Get-Content $runtimeSkillMd -Raw
          if ($updatedContent -notmatch "canonical v2") {
            throw "Upstream update failed to synchronize"
          }

          # 4. Local drift conflict (R != B != C)
          @("local drift content") | Set-Content $runtimeSkillMd
          $driftError = python -m aikito sync project win-copy 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            throw "Expected sync project to fail on local drift"
          }
          if ($driftError -notmatch "drifted") {
            throw "Expected error output to mention drifted skill"
          }
          $global:LASTEXITCODE = 0

          # 5. Overwrite drift with --force
          python -m aikito sync project win-copy --force
          $forcedContent = Get-Content $runtimeSkillMd -Raw
          if ($forcedContent -notmatch "canonical v2") {
            throw "--force did not overwrite drifted skill"
          }

          # 6. Deselection preservation (aikito rm skill --project preserves files on disk)
          python -m aikito rm skill win-copy-skill --project win-copy
          python -m aikito sync project win-copy
          if (-not (Test-Path $runtimeSkill)) {
            throw "Deselected copy skill was deleted from disk"
          }
          if (-not (Test-Path $runtimeSkillMd)) {
            throw "Deselected copy skill file was deleted from disk"
          }

          # 7. Re-register and reactivate state with --force
          python -m aikito add skill win-copy-skill --project win-copy
          python -m aikito sync project win-copy --force
          if (-not (Test-Path $runtimeSkillMd)) {
            throw "Reactivated skill is missing on disk"
          }

      - name: Verify Graceful Failure When Symlinks Unavailable
        shell: pwsh
        run: |
          $noSymWs = Join-Path $env:RUNNER_TEMP "aikito-no-symlink-ws"
          $env:AIKITO_DIR = $noSymWs
          $env:AIKITO_FORCE_NO_SYMLINK = "1"
          $output = python -m aikito init workspace "$noSymWs" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Expected init workspace to fail without symlink support" }
          if (-not ($output | Out-String | Select-String "Developer Mode")) {
            throw "Expected Developer Mode guidance in failure output"
          }
          $global:LASTEXITCODE = 0
          $env:AIKITO_FORCE_NO_SYMLINK = ""

      - name: Windows smoke - Workspace public API and unified coordination (Phase 8)
        shell: pwsh
        run: |
          $ws = Join-Path $env:RUNNER_TEMP "aikito-ws"
          $env:AIKITO_DIR = $ws
          python -c "
          from aikito import Workspace, WorkspaceNotFoundError, InvalidWorkspaceError
          import os, tempfile
          from pathlib import Path

          ws_path = os.environ['AIKITO_DIR']
          ws = Workspace.load(ws_path)
          assert ws.path.resolve() == Path(ws_path).resolve()
          insp = ws.inspect()
          assert insp.workspace_dir.resolve() == ws.path.resolve()
          assert isinstance(insp.projects, tuple)

          preview = ws.plan_sync()
          assert preview.workspace_path.resolve() == Path(ws_path).resolve()
          assert isinstance(preview.can_apply, bool)

          try:
              Workspace.load('C:/nonexistent/path/to/ws')
              raise AssertionError('Expected WorkspaceNotFoundError')
          except WorkspaceNotFoundError:
              pass

          try:
              Workspace.load('relative/path/to/ws')
              raise AssertionError('Expected InvalidWorkspaceError')
          except InvalidWorkspaceError:
              pass
          "

      - name: Windows smoke - CWD-centric interaction
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "src"
          $ws = Join-Path $env:RUNNER_TEMP "aikito-ws"
          $env:AIKITO_DIR = $ws
          $cwdProj = Join-Path $env:RUNNER_TEMP "cwd-test-proj"
          $otherProj = Join-Path $env:RUNNER_TEMP "other-test-proj"
          New-Item -ItemType Directory -Force -Path $cwdProj, $otherProj | Out-Null
          python -m aikito init project cwd-proj $cwdProj
          python -m aikito init project other-proj $otherProj

          Push-Location $cwdProj
          try {
            # 1. sync project inside project directory without project_name
            $syncOut = python -m aikito sync project | Out-String
            if ($syncOut -notmatch "\[aikito\] Target project: 'cwd-proj' \(detected from cwd\)") {
              throw "sync project did not detect cwd-proj from cwd"
            }

            # 2. show project and show project . inside project directory
            $showOut = python -m aikito show project | Out-String
            if ($showOut -notmatch "\[aikito\] Target project: 'cwd-proj' \(detected from cwd\)") {
              throw "show project did not detect cwd-proj from cwd"
            }
            if ($showOut -notmatch "Project: cwd-proj") {
              throw "show project did not display project cwd-proj"
            }

            $showDotOut = python -m aikito show project . | Out-String
            if ($showDotOut -notmatch "Project: cwd-proj") {
              throw "show project . did not display project cwd-proj"
            }

            # 3. diff inside project directory scopes to project, and diff --all includes all projects
            $winCopySkillMd = Join-Path $env:RUNNER_TEMP "win-copy-proj\.agents\skills\win-copy-skill\SKILL.md"
            @("drift in win-copy") | Set-Content $winCopySkillMd
            $diffOut = python -m aikito diff | Out-String
            if ($diffOut -notmatch "\[aikito\] Target project: 'cwd-proj' \(detected from cwd\)") {
              throw "diff did not detect cwd-proj from cwd"
            }
            if ($diffOut -match "win-copy-skill") {
              throw "diff unexpectedly included win-copy-skill from another project"
            }
            $diffAllOut = python -m aikito diff --all | Out-String
            if ($diffAllOut -notmatch "win-copy-skill") {
              throw "diff --all did not include win-copy-skill"
            }
            if ($diffAllOut -notmatch "drift in win-copy") {
              throw "diff --all did not include drift content"
            }
            python -m aikito sync project win-copy --force | Out-Null

            # 4. show memory inside project directory scopes to project + global, and --all includes other projects
            $globalNotesDir = Join-Path $ws "memory\notes"
            New-Item -ItemType Directory -Force -Path $globalNotesDir | Out-Null
            @("# Smoke Global Note") | Set-Content (Join-Path $globalNotesDir "smoke-global-note.md")
            @("# Smoke Other Note") | Set-Content (Join-Path $ws "projects\other-proj\memory\notes\smoke-other-note.md")
            @("# Smoke CWD Note") | Set-Content (Join-Path $ws "projects\cwd-proj\memory\notes\smoke-cwd-note.md")

            $memOut = python -m aikito show memory | Out-String
            if ($memOut -notmatch "\[aikito\] Target project: 'cwd-proj' \(detected from cwd\)") {
              throw "show memory did not detect cwd-proj from cwd"
            }
            if ($memOut -notmatch "smoke-cwd-note") {
              throw "show memory did not include smoke-cwd-note"
            }
            if ($memOut -notmatch "smoke-global-note") {
              throw "show memory did not include global smoke-global-note"
            }
            if ($memOut -match "smoke-other-note") {
              throw "show memory unexpectedly included smoke-other-note from another project"
            }

            $memAllOut = python -m aikito show memory --all | Out-String
            if ($memAllOut -notmatch "smoke-cwd-note") {
              throw "show memory --all did not include smoke-cwd-note"
            }
            if ($memAllOut -notmatch "smoke-global-note") {
              throw "show memory --all did not include smoke-global-note"
            }
            if ($memAllOut -notmatch "smoke-other-note") {
              throw "show memory --all did not include smoke-other-note"
            }

            # 5. add skill inside project directory defaults to current project; --global adds globally without project registration
            $skillOut = python -m aikito add skill cwd-skill --description "CWD test skill" | Out-String
            if ($skillOut -notmatch "\[aikito\] Target project: 'cwd-proj' \(detected from cwd\)") {
              throw "add skill did not detect cwd-proj from cwd"
            }
            $skillPath = Join-Path $ws "skills\cwd-skill\SKILL.md"
            if (-not (Test-Path $skillPath)) {
              throw "add skill did not create canonical skill file"
            }
            $projAgentToml = Join-Path $ws "projects\cwd-proj\agent.toml"
            if ((Get-Content $projAgentToml -Raw) -notmatch "cwd-skill") {
              throw "add skill did not register skill in project agent.toml"
            }

            $globalSkillOut = python -m aikito add skill global-skill --global --description "Global test skill" | Out-String
            if ($globalSkillOut -match "\[aikito\] Target project: 'cwd-proj'") {
              throw "add skill --global unexpectedly scoped to cwd project"
            }
            $globalSkillPath = Join-Path $ws "skills\global-skill\SKILL.md"
            if (-not (Test-Path $globalSkillPath)) {
              throw "add skill --global did not create canonical skill file"
            }
            if ((Get-Content $projAgentToml -Raw) -match "global-skill") {
              throw "add skill --global unexpectedly registered skill in project agent.toml"
            }

            # 6. edit instructions without arguments: resolves to project inside cwd
            $editedProjFile = Join-Path $env:RUNNER_TEMP "edited-proj.out"
            $env:EDITOR = "python -c `"import sys, pathlib; pathlib.Path(r'$editedProjFile').write_text(sys.argv[1])`""
            $editOut = python -m aikito edit instructions | Out-String
            if ($editOut -notmatch "\[aikito\] Target project: 'cwd-proj' \(detected from cwd\)") {
              throw "edit instructions did not detect cwd-proj from cwd"
            }
            $editedTarget = Get-Content $editedProjFile -Raw
            if ($editedTarget -notmatch "cwd-proj.*AGENTS.md") {
              throw "edit instructions did not target cwd-proj AGENTS.md"
            }
          }
          finally {
            Pop-Location
          }

          # 7. Outside project directory: edit instructions falls back to global, sync project fails with clear error
          Push-Location $env:RUNNER_TEMP
          try {
            $editedGlobalFile = Join-Path $env:RUNNER_TEMP "edited-global.out"
            $env:EDITOR = "python -c `"import sys, pathlib; pathlib.Path(r'$editedGlobalFile').write_text(sys.argv[1])`""
            $outsideEditOut = python -m aikito edit instructions | Out-String
            if ($outsideEditOut -match "\[aikito\] Target project:") {
              throw "edit instructions outside project unexpectedly detected a project"
            }
            $editedGlobalTarget = Get-Content $editedGlobalFile -Raw
            if ($editedGlobalTarget -notmatch "aikito-ws.*global.*AGENTS.md") {
              throw "edit instructions outside project did not target global AGENTS.md"
            }
            $env:EDITOR = ""

            $outsideErr = python -m aikito sync project 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) {
              throw "Expected sync project outside project directory to fail"
            }
            if ($outsideErr -notmatch "Current directory is not inside a registered project") {
              throw "sync project error did not explain missing project context"
            }
            $global:LASTEXITCODE = 0
          }
          finally {
            Pop-Location
          }

          Remove-Item -Recurse -Force $cwdProj, $otherProj
          Remove-Item -Recurse -Force (Join-Path $ws "projects\cwd-proj"), (Join-Path $ws "projects\other-proj")
          Remove-Item -Recurse -Force (Join-Path $ws "skills\cwd-skill"), (Join-Path $ws "skills\global-skill")
          Remove-Item -Force (Join-Path $globalNotesDir "smoke-global-note.md")

