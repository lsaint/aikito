name: Windows CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.group }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: ["core-cli", "workspace", "workspace-encrypted"]

    steps:
      - uses: actions/checkout@v4

      - name: Optimize Windows Defender for CI
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          } catch {}
          try {
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, $env:TEMP, $env:TMP, $HOME, "C:\hostedtoolcache" -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionProcess @("python.exe", "git.exe", "pytest.exe") -ErrorAction SilentlyContinue
          } catch {}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv pip install --system pytest pytest-xdist '.[encrypted]'

      - name: Run core CLI unit tests
        if: matrix.group == 'core-cli'
        shell: pwsh
        run: python -m pytest -n auto --basetemp="$env:RUNNER_TEMP\pytest" tests/test_cli.py tests/test_add.py tests/test_doctor.py tests/test_status.py tests/test_adopt.py tests/test_remove.py tests/test_compat.py tests/test_mcp.py

      - name: Run workspace unit tests
        if: matrix.group == 'workspace'
        shell: pwsh
        run: python -m pytest -n auto --basetemp="$env:RUNNER_TEMP\pytest" tests/test_workspace.py tests/test_workspace_characterization.py tests/test_workspace_import.py tests/test_workspace_import_conflicts.py tests/test_workspace_inspection_golden.py tests/test_workspace_layout.py tests/test_workspace_payload.py tests/test_workspace_resources.py tests/test_workspace_revision.py tests/test_workspace_sync_golden.py tests/test_workspace_sync_plan.py tests/test_workspace_remote_store.py tests/test_workspace_remote_store_contract.py tests/test_workspace_reconcile_filesystem.py tests/test_workspace_reconcile_pending.py tests/test_workspace_reconcile_resources.py tests/test_workspace_pending_commit.py tests/test_remote_service.py

      - name: Run encrypted unit tests
        if: matrix.group == 'workspace-encrypted'
        run: |
          python -m pytest -n auto --basetemp="$env:RUNNER_TEMP\pytest" tests/test_workspace_encrypted_remote_core.py tests/test_workspace_device_keys.py tests/test_recovery_codes.py tests/test_workspace_native_keys.py tests/test_workspace_encrypted_remote.py tests/test_remote_key_cli.py tests/test_workspace_encrypted_discovery.py tests/test_workspace_encrypted_sync.py tests/test_workspace_scoped_export.py tests/test_workspace_context_export.py tests/test_recipient_keys.py tests/test_remote_export.py

  windows-smoke-test:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - name: Optimize Windows Defender for CI
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          } catch {}
          try {
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, $env:TEMP, $env:TMP, $HOME, "C:\hostedtoolcache" -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionProcess @("python.exe", "git.exe", "pytest.exe") -ErrorAction SilentlyContinue
          } catch {}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install smoke test dependencies
        run: uv pip install --system pytest pytest-xdist '.[encrypted]'

      - name: Install and verify Windows console script entrypoint
        shell: pwsh
        run: |
          python -m pip install --no-deps .
          $aikitoCmd = Get-Command aikito.exe -ErrorAction Stop
          Write-Host "Found entrypoint: $($aikitoCmd.Source)"
          aikito --version
          aikito --help

      - name: Windows DPAPI native key storage smoke
        shell: pwsh
        run: |
          $nativeBase = Join-Path $env:RUNNER_TEMP "native-key-check"
          python tests/workspace_native_key_smoke.py "$nativeBase"

      - name: Windows workspace reconciliation smoke
        shell: pwsh
        run: |
          $reconcileBase = Join-Path $env:RUNNER_TEMP "reconcile-smoke"
          python tests/workspace_reconcile_smoke.py "$reconcileBase"

      - name: Test PowerShell Completion Generator and Loading
        shell: pwsh
        run: |
          $script = python -m aikito completion powershell
          if ($LASTEXITCODE -ne 0) { throw "aikito completion powershell failed" }
          $scriptBlock = [scriptblock]::Create($script)
          $ExecutionContext.InvokeCommand.InvokeScript($scriptBlock)

      - name: End-to-end CLI workflow suite on Windows
        shell: pwsh
        run: python -m pytest -m smoke tests/test_cli_workflow_e2e.py
