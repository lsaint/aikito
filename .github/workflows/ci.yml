name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14-dev"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify executable entry point
        run: |
          test -x bin/aikito
          bin/aikito --help
          bin/aikito version

      - name: aikito --help
        run: python3 bin/aikito --help

      - name: aikito version
        run: python3 bin/aikito version

      - name: aikito subcommand --help
        run: |
          python3 bin/aikito init --help
          python3 bin/aikito init workspace --help
          python3 bin/aikito init project --help
          python3 bin/aikito add --help
          python3 bin/aikito add skill --help
          python3 bin/aikito add subagent --help
          python3 bin/aikito add mcp --help
          python3 bin/aikito adopt --help
          python3 bin/aikito status --help
          python3 bin/aikito sync --help
          python3 bin/aikito show --help
          python3 bin/aikito show inbox --help
          python3 bin/aikito doctor --help
          python3 bin/aikito web --help
          python3 bin/aikito maintain memory --help
          python3 bin/aikito completion --help
          python3 bin/aikito completion candidates --help

      # Simulate installed agents so sync/doctor exercise real logic instead of skipping.
      # Paths mirror the instruction_path / skills_path parent dirs from agents.toml template.
      - name: Create mock agent directories
        run: |
          mkdir -p \
            ~/.codex \
            ~/.claude \
            ~/.copilot/agents \
            ~/.gemini/antigravity-cli \
            ~/.gemini/config \
            ~/.config/opencode

      - name: aikito init workspace (fresh workspace)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito init workspace ${{ runner.temp }}/aikito-ws
          test -f ${{ runner.temp }}/aikito-ws/config.toml

      - name: aikito workspace persistence
        run: |
          mkdir -p ${{ runner.temp }}/pointer-home
          HOME=${{ runner.temp }}/pointer-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/pointer-home/.config \
            python3 bin/aikito init workspace ${{ runner.temp }}/pointer-ws
          test "$(HOME=${{ runner.temp }}/pointer-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/pointer-home/.config \
            python3 bin/aikito path workspace)" = \
            "${{ runner.temp }}/pointer-ws"
          HOME=${{ runner.temp }}/pointer-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/pointer-home/.config \
            python3 bin/aikito status

      # README Quick Start: init workspace → sync global → init project → status
      - name: aikito sync global
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync global

      - name: aikito init project (fresh and idempotent)
        run: |
          mkdir -p ${{ runner.temp }}/example-project
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito init project example ${{ runner.temp }}/example-project
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito init project example ${{ runner.temp }}/example-project
          test -L ${{ runner.temp }}/example-project/.agents/AGENTS.md
          test -L ${{ runner.temp }}/example-project/.agents/memory/index.md

      - name: aikito project inspection and dry-run
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show projects
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show project example
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync project example --dry-run
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito diff

      - name: aikito add resources (skill, subagent, mcp)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito add skill ci-skill --description "CI test skill"
          test -f ${{ runner.temp }}/aikito-ws/skills/ci-skill/SKILL.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito add subagent ci-subagent --description "CI test subagent"
          test -f ${{ runner.temp }}/aikito-ws/subagents/ci-subagent.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito add mcp ci-mcp --url "https://example.com/mcp"
          test -f ${{ runner.temp }}/aikito-ws/mcps/ci-mcp.toml

      - name: aikito sync MCP and subagents
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync global
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync mcp
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync subagents
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync global
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync mcp
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync subagents
          test -L ~/.agents/skills/ci-skill
          test -L ~/.codex/AGENTS.md
          test -L ~/.claude/skills
          test -L ~/.config/opencode/AGENTS.md
          test -f ~/.codex/config.toml
          test -f ~/.codex/agents/ci-subagent.toml
          test -f ~/.claude/agents/ci-subagent.md
          test -f ~/.config/opencode/agents/ci-subagent.md

      - name: aikito resource inspection
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show skill ci-skill | grep -q "CI test skill"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show subagents ci-subagent | \
            grep -q "# Ci Subagent"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show mcp ci-mcp | grep -q "https://example.com/mcp"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show instructions global | \
            grep -q "# Global Agent Directives"

      - name: aikito status
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito status

      - name: aikito web
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito web --port 8765 --no-open &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ > "${{ runner.temp }}/aikito-web.html"; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/ | grep -q '<title>Aikito Console</title>'
          curl --fail --silent http://127.0.0.1:8765/api/overview | \
            python3 -c 'import json, sys; data = json.load(sys.stdin); assert data["version"]'

      - name: aikito memory maintenance validation
        run: |
          if AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito maintain memory missing-project; then
            exit 1
          fi

      - name: aikito memory lifecycle
        run: |
          mkdir -p ${{ runner.temp }}/aikito-ws/memory/notes
          printf '# CI memory note\n' > \
            ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory.md
          printf '\n- [[ci-memory|CI memory]]\n' >> \
            ${{ runner.temp }}/aikito-ws/memory/index.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show memory ci-memory | grep -q "CI memory note"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito rename memory ci-memory ci-memory-renamed
          test -f ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory-renamed.md
          test ! -e ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory.md
          grep -q 'ci-memory-renamed' ${{ runner.temp }}/aikito-ws/memory/index.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito rm memory ci-memory-renamed
          test ! -e ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory-renamed.md
          if grep -q 'ci-memory-renamed' \
            ${{ runner.temp }}/aikito-ws/memory/index.md; then
            exit 1
          fi

      # doctor should report all symlinks and config.toml OK after sync
      - name: aikito doctor
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor --stale-days 14
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor --json

      - name: Verify workspace config customization in CI
        run: |
          cat << 'EOF' > ${{ runner.temp }}/aikito-ws/config.toml
          # Workspace custom test config
          [memory]
          stale_days = 14

          [inbox]
          path = "~/aikito/inbox"
          EOF
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor

      - name: aikito inbox inspection (missing, empty, note list, and target reading)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show inbox
          mkdir -p ${{ runner.temp }}/aikito-ws/inbox
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show inbox
          echo "# CI Test Inbox Note" > ${{ runner.temp }}/aikito-ws/inbox/ci-note.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show inbox
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito show inbox ci-note

      # README Migration: aikito adopt (dry-run, no --apply)
      - name: aikito adopt (dry-run)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito adopt

      - name: aikito completion scripts and dynamic candidates
        run: |
          python3 bin/aikito completion zsh > ${{ runner.temp }}/_aikito
          python3 bin/aikito completion bash > ${{ runner.temp }}/aikito.bash
          python3 bin/aikito completion fish > ${{ runner.temp }}/aikito.fish
          test -s ${{ runner.temp }}/_aikito
          test -s ${{ runner.temp }}/aikito.bash
          test -s ${{ runner.temp }}/aikito.fish
          bash -n ${{ runner.temp }}/aikito.bash
          zsh -n ${{ runner.temp }}/_aikito
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito completion candidates memories
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito completion candidates inbox-completions
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito completion candidates skills
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito completion candidates projects
