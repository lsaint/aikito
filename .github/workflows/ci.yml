name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest

  smoke-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: aikito --help
        run: python3 -m aikito --help

      - name: aikito version
        run: python3 -m aikito version

      - name: aikito subcommand --help
        run: |
          python3 -m aikito init --help
          python3 -m aikito init workspace --help
          python3 -m aikito init project --help
          python3 -m aikito add --help
          python3 -m aikito add skill --help
          python3 -m aikito add subagent --help
          python3 -m aikito add mcp --help
          python3 -m aikito adopt --help
          python3 -m aikito status --help
          python3 -m aikito sync --help
          python3 -m aikito show --help
          python3 -m aikito show inbox --help
          python3 -m aikito doctor --help
          python3 -m aikito web --help
          python3 -m aikito maintain memory --help
          python3 -m aikito completion --help
          python3 -m aikito completion candidates --help

      # Simulate installed agents so sync/doctor exercise real logic instead of skipping.
      # Paths mirror the instruction_path / skills_path parent dirs from agents.toml template.
      - name: Create mock agent directories
        run: |
          mkdir -p \
            ~/.codex \
            ~/.claude \
            ~/.copilot/agents \
            ~/.grok/rules \
            ~/.gemini/antigravity-cli \
            ~/.gemini/config \
            ~/.config/opencode \
            ~/.pi/agent

      - name: aikito init workspace (fresh workspace)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito init workspace ${{ runner.temp }}/aikito-ws
          test -f ${{ runner.temp }}/aikito-ws/config.toml

      - name: Pip install source and verify workspace init
        env:
          PYTHONPATH: ""  # override job-level PYTHONPATH so installed package is tested, not src/
        run: |
          python -m venv ${{ runner.temp }}/src-venv
          ${{ runner.temp }}/src-venv/bin/pip install .
          HOME=${{ runner.temp }}/installed-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/installed-home/.config \
            ${{ runner.temp }}/src-venv/bin/aikito init workspace \
              ${{ runner.temp }}/installed-workspace
          test -f ${{ runner.temp }}/installed-workspace/config.toml
          test -f ${{ runner.temp }}/installed-workspace/skills/aikito/SKILL.md
          test -f \
            ${{ runner.temp }}/installed-workspace/skills/durable-memory/SKILL.md

      - name: Build wheel and verify package contents
        env:
          PYTHONPATH: ""  # override job-level PYTHONPATH so wheel install is tested, not src/
        run: |
          python -m pip install --upgrade build hatchling pytest twine
          python -m build
          python -m twine check --strict dist/*
          python3 -c "
          import zipfile, hashlib, pathlib, subprocess, tarfile, tempfile

          wheel_path = list(pathlib.Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(wheel_path) as z:
              wheel_names = sorted(
                  n.replace('aikito/', '', 1)
                  for n in z.namelist()
                  if n.startswith('aikito/templates/') and not n.endswith('/')
              )
              wheel_data = z.read('aikito/web/assets/logo.png')
              marked_wheel = z.read('aikito/web/marked.umd.js')
              metadata_names = [n for n in z.namelist() if n.endswith('/METADATA')]
              assert metadata_names, 'METADATA missing from wheel'
              metadata_text = z.read(metadata_names[0]).decode('utf-8')
              assert 'Metadata-Version: 2.3' in metadata_text, f'Unexpected Metadata-Version: {metadata_text[:100]}'

          git_names = sorted(
              p.replace('src/aikito/', '', 1)
              for p in subprocess.check_output(
                  ['git', 'ls-files', 'src/aikito/templates'], text=True
              ).splitlines()
          )
          assert wheel_names == git_names, f'Template file mismatch:\n  wheel={wheel_names}\n  git={git_names}'

          src_data = open('src/aikito/web/assets/logo.png', 'rb').read()
          assert hashlib.sha256(wheel_data).hexdigest() == hashlib.sha256(src_data).hexdigest(), 'logo.png SHA256 mismatch'

          marked_src = open('src/aikito/web/marked.umd.js', 'rb').read()
          assert hashlib.sha256(marked_wheel).hexdigest() == hashlib.sha256(marked_src).hexdigest(), 'marked.umd.js SHA256 mismatch'
          print('Wheel contents and metadata verified OK')

          # Verify sdist test suite execution
          sdist_path = list(pathlib.Path('dist').glob('*.tar.gz'))[0]
          with tempfile.TemporaryDirectory() as tmp:
              with tarfile.open(sdist_path, 'r:gz') as tar:
                  tar.extractall(path=tmp)
              unpacked_dir = list(pathlib.Path(tmp).iterdir())[0]
              subprocess.check_call(['pytest', '-q'], cwd=unpacked_dir)
          print('Sdist test suite verified OK')
          "
          python -m venv ${{ runner.temp }}/isolated-venv
          ${{ runner.temp }}/isolated-venv/bin/pip install dist/*.whl
          ${{ runner.temp }}/isolated-venv/bin/aikito --version
          ${{ runner.temp }}/isolated-venv/bin/python -c \
            "from aikito import PreparedProject, Project; assert Project and PreparedProject"
          ${{ runner.temp }}/isolated-venv/bin/aikito init workspace ${{ runner.temp }}/wheel-ws
          test -f ${{ runner.temp }}/wheel-ws/agents.toml
          test -f ${{ runner.temp }}/wheel-ws/skills/aikito/SKILL.md
          test -f ${{ runner.temp }}/wheel-ws/skills/durable-memory/SKILL.md
          mkdir -p ${{ runner.temp }}/wheel-project
          mkdir -p ${{ runner.temp }}/wheel-project-second
          AIKITO_DIR=${{ runner.temp }}/wheel-ws \
            ${{ runner.temp }}/isolated-venv/bin/aikito init project \
              wheel-example ${{ runner.temp }}/wheel-project
          AIKITO_DIR=${{ runner.temp }}/wheel-ws \
            AIKITO_TEST_PROJECT_PATH=${{ runner.temp }}/wheel-project-second \
            ${{ runner.temp }}/isolated-venv/bin/python -c "
          import os
          from pathlib import Path
          from aikito import Project
          updated = Project.load('wheel-example').add_path(os.environ['AIKITO_TEST_PROJECT_PATH'])
          assert Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve() in updated.paths
          "


      - name: aikito workspace persistence
        run: |
          mkdir -p ${{ runner.temp }}/pointer-home
          HOME=${{ runner.temp }}/pointer-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/pointer-home/.config \
            python3 -m aikito init workspace ${{ runner.temp }}/pointer-ws
          test "$(HOME=${{ runner.temp }}/pointer-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/pointer-home/.config \
            python3 -m aikito path workspace)" = \
            "${{ runner.temp }}/pointer-ws"
          HOME=${{ runner.temp }}/pointer-home \
            XDG_CONFIG_HOME=${{ runner.temp }}/pointer-home/.config \
            python3 -m aikito status

      # README Quick Start: init workspace → sync global → init project → status
      - name: aikito sync global
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync global

      - name: aikito init project (fresh and idempotent)
        run: |
          mkdir -p ${{ runner.temp }}/example-project
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito init project example \
            ${{ runner.temp }}/example-project \
            --description "CI example project"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito init project example ${{ runner.temp }}/example-project
          grep -q 'description = "CI example project"' \
            ${{ runner.temp }}/aikito-ws/projects/example/agent.toml
          test ! -e ${{ runner.temp }}/example-project/.agents/AGENTS.md
          test ! -e ${{ runner.temp }}/example-project/AGENTS.md
          test ! -e ${{ runner.temp }}/example-project/.claude/CLAUDE.md
          test -L ${{ runner.temp }}/example-project/.agents/memory/notes

      - name: aikito project inspection and dry-run
        run: |
          printf '# CI project instructions\n' > \
            ${{ runner.temp }}/aikito-ws/projects/example/AGENTS.md
          python3 -c "
          from pathlib import Path
          path = Path(r'${{ runner.temp }}/aikito-ws/projects/example/agent.toml')
          text = path.read_text()
          path.write_text(text.replace('skills = []', 'skills = [\"durable-memory\"]'))
          "
          AIKITO_DIR=${{ runner.temp }}/aikito-ws python3 -c "
          from aikito import Project
          prepared = Project.load('example').prepare(agent='pi')
          assert prepared.name == 'example'
          "
          test -L ${{ runner.temp }}/example-project/AGENTS.md
          test -L \
            ${{ runner.temp }}/example-project/.agents/skills/durable-memory
          test -L ${{ runner.temp }}/example-project/.agents/memory/notes
          mkdir -p ${{ runner.temp }}/example-project-second
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            AIKITO_TEST_PROJECT_PATH=${{ runner.temp }}/example-project-second \
            python3 -c "
          import os
          from pathlib import Path
          from aikito import Project
          updated = Project.load('example').add_path(os.environ['AIKITO_TEST_PROJECT_PATH'])
          assert Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve() in updated.paths
          "
          if AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -c "from aikito import Project; Project.load('example').prepare(agent='pi')" \
              2>${{ runner.temp }}/prepare-ambiguous.log; then
            echo "Expected ambiguous project preparation to fail"
            exit 1
          fi
          grep -q "Multiple paths are available" \
            ${{ runner.temp }}/prepare-ambiguous.log
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            AIKITO_TEST_PROJECT_PATH=${{ runner.temp }}/example-project-second \
            python3 -c "
          import os
          from pathlib import Path
          from aikito import Project
          prepared = Project.load('example').prepare(
              agent='pi', path=os.environ['AIKITO_TEST_PROJECT_PATH']
          )
          assert prepared.cwd == Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve()
          "
          test -L ${{ runner.temp }}/example-project-second/AGENTS.md
          test -L \
            ${{ runner.temp }}/example-project-second/.agents/skills/durable-memory
          test -L ${{ runner.temp }}/example-project-second/.agents/memory/notes
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show projects
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show project example | grep -q "CI example project"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show project example | grep -q "Project paths"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync project example --dry-run
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito diff

      - name: aikito add resources (skill, subagent, mcp)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito add skill ci-skill --description "CI test skill"
          test -f ${{ runner.temp }}/aikito-ws/skills/ci-skill/SKILL.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito add subagent ci-subagent \
            --description "CI test subagent" \
            --agents "codex,claude-code,agy,opencode,github-copilot,pi"
          test -f ${{ runner.temp }}/aikito-ws/subagents/ci-subagent.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito add mcp ci-mcp --url "https://example.com/mcp"
          test -f ${{ runner.temp }}/aikito-ws/mcps/ci-mcp.toml

      - name: aikito sync without Pi subagent extension
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync global
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync mcp
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync subagents
          test ! -e ~/.pi/agent/agents

      - name: aikito sync with Pi subagent extension
        run: |
          mkdir -p ~/.pi/agent/extensions/subagent
          touch ~/.pi/agent/extensions/subagent/index.ts
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync global
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync mcp
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync subagents
          test -L ~/.agents/skills/ci-skill
          test -L ~/.codex/AGENTS.md
          test -L ~/.claude/skills
          test -L ~/.grok/rules/aikito.md
          test -L ~/.config/opencode/AGENTS.md
          test -f ~/.codex/config.toml
          test -f ~/.codex/agents/ci-subagent.toml
          test -f ~/.claude/agents/ci-subagent.md
          test -f ~/.config/opencode/agents/ci-subagent.md
          test -f ~/.pi/agent/agents/ci-subagent.md
          grep -q 'generated by aikito from subagents/ci-subagent.md' \
            ~/.pi/agent/agents/ci-subagent.md

      - name: aikito resource inspection
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show skill ci-skill | grep -q "CI test skill"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show subagents ci-subagent | \
            grep -q "# Ci Subagent"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show mcp ci-mcp | grep -q "https://example.com/mcp"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show instructions global | \
            grep -q "durable-memory"

      - name: aikito status
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito status

      - name: aikito web
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito web --port 8765 --no-open &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ > "${{ runner.temp }}/aikito-web.html"; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/ | grep -q '<title>Aikito Console</title>'
          curl --fail --silent http://127.0.0.1:8765/api/overview | \
            python3 -c 'import json, sys; data = json.load(sys.stdin); assert data["version"]'

      - name: aikito memory maintenance validation
        run: |
          if AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito maintain memory missing-project; then
            exit 1
          fi

      - name: aikito memory lifecycle
        run: |
          mkdir -p ${{ runner.temp }}/aikito-ws/memory/notes
          printf '%s\n' '# CI memory note' > \
            ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory.md
          mkdir -p ${{ runner.temp }}/aikito-ws/projects/example/memory/notes
          printf '%s\n' '# CI project memory note' > \
            ${{ runner.temp }}/aikito-ws/projects/example/memory/notes/ci-proj-memory.md
          printf '%s\n' '# Legacy index' '- [[ci-memory|CI memory note]]' > \
            ${{ runner.temp }}/aikito-ws/memory/index.md
          printf '%s\n' '# Legacy project index' '- [[ci-proj-memory|CI project memory note]]' > \
            ${{ runner.temp }}/aikito-ws/projects/example/memory/index.md
          if EDITOR=true AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito edit memory global/index; then
            exit 1
          fi
          test ! -e ${{ runner.temp }}/aikito-ws/index.md
          if EDITOR=true AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito edit memory example/index; then
            exit 1
          fi
          test ! -e ${{ runner.temp }}/aikito-ws/projects/example/index.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show memory --project example | grep -q "ci-proj-memory"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show memory ci-proj-memory --project example | \
            grep -q "CI project memory note"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show memory ci-memory | grep -q "CI memory note"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show memory ci-memory --project global | grep -q "CI memory note"
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito rename memory ci-memory ci-memory-renamed
          test -f ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory-renamed.md
          test ! -e ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory.md
          grep -q 'ci-memory|CI memory note' ${{ runner.temp }}/aikito-ws/memory/index.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito rm memory ci-memory-renamed
          test ! -e ${{ runner.temp }}/aikito-ws/memory/notes/ci-memory-renamed.md
          grep -q 'ci-memory|CI memory note' ${{ runner.temp }}/aikito-ws/memory/index.md
          test -f ${{ runner.temp }}/aikito-ws/projects/example/memory/notes/ci-proj-memory.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito rm memory ci-proj-memory
          test ! -e ${{ runner.temp }}/aikito-ws/projects/example/memory/notes/ci-proj-memory.md
          printf '%s\n' '# Malformed memory note' > \
            ${{ runner.temp }}/aikito-ws/memory/notes/malformed.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito rm memory malformed
          test ! -e ${{ runner.temp }}/aikito-ws/memory/notes/malformed.md
          printf '%s\n' '# Rename repair note' > \
            ${{ runner.temp }}/aikito-ws/memory/notes/rename-repair.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito rename memory rename-repair renamed-repair
          test -f ${{ runner.temp }}/aikito-ws/memory/notes/renamed-repair.md
          if grep -q 'category:' \
            ${{ runner.temp }}/aikito-ws/memory/notes/renamed-repair.md; then
            exit 1
          fi
          printf '%s\n' '# Sync malformed note' > \
            ${{ runner.temp }}/aikito-ws/projects/example/memory/notes/sync-malformed.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito sync project example 2> \
            ${{ runner.temp }}/project-memory-sync.err
          test ! -s ${{ runner.temp }}/project-memory-sync.err
          test -L ${{ runner.temp }}/example-project/.agents/memory/notes
          test ! -e ${{ runner.temp }}/example-project/.agents/memory/index.md
          if grep -q 'category:' \
            ${{ runner.temp }}/aikito-ws/projects/example/memory/notes/sync-malformed.md; then
            exit 1
          fi
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito rm memory sync-malformed

      # doctor should report all symlinks and config.toml OK after sync
      - name: aikito doctor
        run: |
          mkdir -p ${{ runner.temp }}/aikito-ws/memory/notes/nested
          printf '%s\n' '# Hidden nested note' > \
            ${{ runner.temp }}/aikito-ws/memory/notes/nested/hidden.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito doctor --no-color | \
            tee ${{ runner.temp }}/doctor-memory-layout.log
          grep -q "memory notes subdirectory 'nested/' is not scanned" \
            ${{ runner.temp }}/doctor-memory-layout.log
          rm ${{ runner.temp }}/aikito-ws/memory/notes/nested/hidden.md
          rmdir ${{ runner.temp }}/aikito-ws/memory/notes/nested
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito doctor --stale-days 14
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito doctor --json

      - name: Verify workspace config customization in CI
        run: |
          cat << 'EOF' > ${{ runner.temp }}/aikito-ws/config.toml
          # Workspace custom test config
          [memory]
          stale_days = 14

          [inbox]
          path = "~/aikito/inbox"
          EOF
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito doctor

      - name: aikito inbox inspection (missing, empty, note list, and target reading)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show inbox
          mkdir -p ${{ runner.temp }}/aikito-ws/inbox
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show inbox
          echo "# CI Test Inbox Note" > ${{ runner.temp }}/aikito-ws/inbox/ci-note.md
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show inbox
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito show inbox ci-note

      # README Migration: aikito adopt (dry-run, no --apply)
      - name: aikito adopt (dry-run)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito adopt

      - name: aikito completion scripts and dynamic candidates
        run: |
          python3 -m aikito completion zsh > ${{ runner.temp }}/_aikito
          python3 -m aikito completion bash > ${{ runner.temp }}/aikito.bash
          python3 -m aikito completion fish > ${{ runner.temp }}/aikito.fish
          test -s ${{ runner.temp }}/_aikito
          test -s ${{ runner.temp }}/aikito.bash
          test -s ${{ runner.temp }}/aikito.fish
          bash -n ${{ runner.temp }}/aikito.bash
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito completion candidates memories
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito completion candidates inbox-completions
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito completion candidates skills
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 -m aikito completion candidates projects

  windows-smoke-test:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Windows CLI Help and Version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m aikito --help
          python -m aikito version
          python -m aikito invalid-subcommand 2>$null
          if ($LASTEXITCODE -eq 0) { throw "aikito did not propagate non-zero exit code on invalid subcommand" }
          $global:LASTEXITCODE = 0

      - name: Install and verify Windows console script entrypoint
        shell: pwsh
        env:
          PYTHONPATH: ""
        run: |
          $winVenv = Join-Path $env:RUNNER_TEMP "win-venv"
          python -m venv $winVenv
          $venvPip = Join-Path $winVenv "Scripts\pip.exe"
          $venvAikito = Join-Path $winVenv "Scripts\aikito.exe"
          & $venvPip install .
          & $venvAikito --help
          & $venvAikito version

      - name: Test PowerShell Completion Generator and Loading
        shell: pwsh
        run: |
          $compScript = python -m aikito completion powershell
          Invoke-Expression ($compScript | Out-String)
          python -m aikito completion candidates projects
          python -m aikito completion candidates skills
          python -m aikito completion candidates memories

      - name: Test Workspace Init, Global Sync and Doctor on Windows
        shell: pwsh
        run: |
          $wsDir = Join-Path $env:RUNNER_TEMP "aikito-ws"
          $piDir = Join-Path $HOME ".pi\agent"
          New-Item -ItemType Directory -Force -Path $piDir | Out-Null
          $env:AIKITO_DIR = $wsDir
          python -m aikito init workspace "$wsDir"
          python -m aikito sync global
          $projectDir = Join-Path $env:RUNNER_TEMP "example-project"
          New-Item -ItemType Directory -Force -Path $projectDir | Out-Null
          python -m aikito init project example "$projectDir"
          $globalNote = Join-Path $wsDir "memory\notes\windows-memory.md"
          @("# Windows Memory") | Set-Content $globalNote
          $projectNote = Join-Path $wsDir "projects\example\memory\notes\windows-project-memory.md"
          @("# Windows Project Memory") | Set-Content $projectNote
          $globalIndex = Join-Path $wsDir "memory\index.md"
          @("# Legacy Index", "- [[windows-memory|Windows Memory]]") | Set-Content $globalIndex
          $projectIndex = Join-Path $wsDir "projects\example\memory\index.md"
          @("# Legacy Project Index", "- [[windows-project-memory|Windows Project Memory]]") | Set-Content $projectIndex
          python -m aikito show memory windows-memory | Select-String "Windows Memory"
          python -m aikito show memory windows-project-memory --project example | Select-String "Windows Project Memory"
          $env:EDITOR = 'python -c "import sys"'
          python -m aikito edit memory global/index
          if ($LASTEXITCODE -eq 0) {
            throw "Editing a legacy memory index unexpectedly succeeded"
          }
          if (Test-Path (Join-Path $wsDir "index.md")) {
            throw "Editing a memory index created a fake workspace index"
          }
          $malformedNote = Join-Path $wsDir "memory\notes\windows-malformed.md"
          @("# Windows Malformed Memory") | Set-Content $malformedNote
          $syncError = Join-Path $env:RUNNER_TEMP "windows-memory-sync.err"
          python -m aikito sync global 2> $syncError
          if ($LASTEXITCODE -ne 0) {
            throw "Global sync failed because of malformed memory"
          }
          if ((Get-Item $syncError).Length -ne 0) {
            throw "Global sync emitted an unexpected memory warning"
          }
          if (Select-String -Path $malformedNote -Pattern "category:") {
            throw "Global sync unexpectedly modified canonical memory"
          }
          python -m aikito rm memory windows-malformed
          if (Test-Path $malformedNote) {
            throw "Malformed target memory note was not removed"
          }
          python -c "from aikito import Project; prepared = Project.load('example').prepare(agent='pi'); assert prepared.name == 'example'"
          if (-not (Test-Path (Join-Path $projectDir ".agents\memory\notes"))) {
            throw "Prepared project memory link is missing"
          }
          if (Test-Path (Join-Path $projectDir ".agents\memory\index.md")) {
            throw "Legacy project memory index was synchronized"
          }
          $secondProjectDir = Join-Path $env:RUNNER_TEMP "example-project-second"
          New-Item -ItemType Directory -Force -Path $secondProjectDir | Out-Null
          $env:AIKITO_TEST_PROJECT_PATH = $secondProjectDir
          python -c "import os; from pathlib import Path; from aikito import Project; prepared = Project.load('example').prepare(agent='pi', path=os.environ['AIKITO_TEST_PROJECT_PATH']); assert prepared.cwd == Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve()"
          if (-not (Test-Path (Join-Path $secondProjectDir ".agents\memory\notes"))) {
            throw "Prepared explicit project path memory link is missing"
          }
          $thirdProjectDir = Join-Path $env:RUNNER_TEMP "example-project-third"
          New-Item -ItemType Directory -Force -Path $thirdProjectDir | Out-Null
          $env:AIKITO_TEST_PROJECT_PATH = $thirdProjectDir
          python -c "import os; from pathlib import Path; from aikito import Project; updated = Project.load('example').add_path(os.environ['AIKITO_TEST_PROJECT_PATH']); assert Path(os.environ['AIKITO_TEST_PROJECT_PATH']).resolve() in updated.paths"
          $nestedNotes = Join-Path $wsDir "memory\notes\nested"
          New-Item -ItemType Directory -Force -Path $nestedNotes | Out-Null
          @("# Hidden nested note") | Set-Content (Join-Path $nestedNotes "hidden.md")
          $doctorOutput = python -m aikito doctor --no-color | Out-String
          if ($doctorOutput -notmatch "memory notes subdirectory 'nested/' is not scanned") {
            throw "Doctor did not report the nested memory note directory"
          }
          Remove-Item -Recurse $nestedNotes
          python -m aikito status
          python -m aikito show memory --project example

      - name: Verify Graceful Failure When Symlinks Unavailable
        shell: pwsh
        run: |
          $noSymWs = Join-Path $env:RUNNER_TEMP "aikito-no-symlink-ws"
          $env:AIKITO_DIR = $noSymWs
          $env:AIKITO_FORCE_NO_SYMLINK = "1"
          $output = python -m aikito init workspace "$noSymWs" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Expected init workspace to fail without symlink support" }
          if (-not ($output | Out-String | Select-String "Developer Mode")) {
            throw "Expected Developer Mode guidance in failure output"
          }
          $global:LASTEXITCODE = 0
          $env:AIKITO_FORCE_NO_SYMLINK = ""
