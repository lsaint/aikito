name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14-dev"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: aikito --help
        run: python3 bin/aikito --help

      - name: aikito version
        run: python3 bin/aikito version

      - name: aikito subcommand --help
        run: |
          python3 bin/aikito init --help
          python3 bin/aikito init workspace --help
          python3 bin/aikito init project --help
          python3 bin/aikito adopt --help
          python3 bin/aikito status --help
          python3 bin/aikito sync --help
          python3 bin/aikito show --help
          python3 bin/aikito doctor --help

      # Simulate installed agents so sync/doctor exercise real logic instead of skipping.
      # Paths mirror the instruction_path / skills_path parent dirs from agents.toml template.
      - name: Create mock agent directories
        run: |
          mkdir -p \
            ~/.codex \
            ~/.claude \
            ~/.copilot/agents \
            ~/.gemini/antigravity-cli \
            ~/.config/opencode

      - name: aikito init workspace (fresh workspace)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito init workspace ${{ runner.temp }}/aikito-ws
          test -f ${{ runner.temp }}/aikito-ws/config.toml

      # README Quick Start: init workspace → sync global → init project → status
      - name: aikito sync global
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync global

      - name: aikito init project (fresh and idempotent)
        run: |
          mkdir -p ${{ runner.temp }}/example-project
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito init project example ${{ runner.temp }}/example-project
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito init project example ${{ runner.temp }}/example-project
          test -L ${{ runner.temp }}/example-project/.agents/AGENTS.md
          test -L ${{ runner.temp }}/example-project/.agents/memory/index.md

      - name: aikito sync MCP and subagents
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync mcp
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito sync subagents

      - name: aikito status
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito status

      # doctor should report all symlinks and config.toml OK after sync
      - name: aikito doctor
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor --stale-days 14
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor --json

      - name: Verify workspace config customization in CI
        run: |
          cat << 'EOF' > ${{ runner.temp }}/aikito-ws/config.toml
          # Workspace custom test config
          [memory]
          stale_days = 14
          EOF
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito doctor

      # README Migration: aikito adopt (dry-run, no --apply)
      - name: aikito adopt (dry-run)
        run: |
          AIKITO_DIR=${{ runner.temp }}/aikito-ws \
            python3 bin/aikito adopt

