name: macOS CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  macos-smoke-test:
    runs-on: macos-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v4

      - name: Set isolated HOME
        run: |
          mkdir -p "${{ runner.temp }}/macos-home"
          echo "HOME=${{ runner.temp }}/macos-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv pip install --system pytest

      - name: Run macOS unit tests
        run: python -m pytest

      - name: Create mock agent directories in isolated home
        run: |
          mkdir -p "$HOME"
          mkdir -p \
            "$HOME/.codex" \
            "$HOME/.claude" \
            "$HOME/.copilot/agents" \
            "$HOME/.dsh" \
            "$HOME/.grok/rules" \
            "$HOME/.gemini/antigravity-cli" \
            "$HOME/.gemini/config" \
            "$HOME/.config/opencode" \
            "$HOME/.pi/agent"
      - name: macOS CLI smoke - Global Sync and Deduplication
        run: |
          WS=${{ runner.temp }}/macos-ws
          AIKITO_DIR=$WS python3 -m aikito init workspace "$WS"
          AIKITO_DIR=$WS python3 -m aikito sync global | tee ${{ runner.temp }}/macos-sync-global.out
          grep -F "3 Agent skill entries across 8 consumers" \
            ${{ runner.temp }}/macos-sync-global.out
          grep -F "skills: shared path" \
            ${{ runner.temp }}/macos-sync-global.out
          test -L "$HOME/.agents/skills/aikito"
          test -L "$HOME/.agents/skills/durable-memory"
          test -f "$HOME/.agents/skills/aikito/SKILL.md"
          test -f "$HOME/.agents/skills/durable-memory/SKILL.md"
          test -L "$HOME/.claude/skills"
          test -L "$HOME/.gemini/antigravity-cli/skills"
          test -L "$HOME/.claude/CLAUDE.md"
          test -L "$HOME/.codex/AGENTS.md"
          # Verify Phase 4 idempotency: repeat sync global must be NOOP (no writes / no recreations)
          AIKITO_DIR=$WS python3 -m aikito sync global | tee ${{ runner.temp }}/macos-sync-global-repeat.out
          grep -F "[SUCCESS] Global resources synced successfully" \
            ${{ runner.temp }}/macos-sync-global-repeat.out
          ! grep -F "[LINK]" ${{ runner.temp }}/macos-sync-global-repeat.out
          ! grep -F "[UNLINK]" ${{ runner.temp }}/macos-sync-global-repeat.out
          test -L "$HOME/.agents/skills/aikito"
          test -L "$HOME/.agents/skills/durable-memory"
          test -L "$HOME/.claude/skills"
          test -L "$HOME/.gemini/antigravity-cli/skills"
          test -L "$HOME/.claude/CLAUDE.md"
          test -L "$HOME/.codex/AGENTS.md"

      - name: macOS CLI smoke - Global Skills Safety and Migration (Phase 4 Invariants)
        run: |
          WS=${{ runner.temp }}/macos-ws
          # 1. Legacy top-level container migration
          LEGACY_HOME=${{ runner.temp }}/macos-legacy-home
          mkdir -p "$LEGACY_HOME/.agents" "$LEGACY_HOME/.claude"
          ln -s "$WS/skills" "$LEGACY_HOME/.agents/skills"
          test -L "$LEGACY_HOME/.agents/skills"
          HOME="$LEGACY_HOME" AIKITO_DIR=$WS python3 -m aikito sync global | tee ${{ runner.temp }}/macos-legacy-mig.out
          grep -F "Replacing old top-level symlink" ${{ runner.temp }}/macos-legacy-mig.out
          test -d "$LEGACY_HOME/.agents/skills"
          test ! -L "$LEGACY_HOME/.agents/skills"
          test -L "$LEGACY_HOME/.agents/skills/aikito"
          test -L "$LEGACY_HOME/.agents/skills/durable-memory"

          # 2. Wrong consumer symlink preservation and conflict
          mkdir -p ${{ runner.temp }}/macos-ext-consumer
          rm -f "$LEGACY_HOME/.claude/skills"
          ln -s "${{ runner.temp }}/macos-ext-consumer" "$LEGACY_HOME/.claude/skills"
          ! HOME="$LEGACY_HOME" AIKITO_DIR=$WS python3 -m aikito sync global 2> ${{ runner.temp }}/macos-wrong-consumer.err
          grep -F "[CONFLICT]" ${{ runner.temp }}/macos-wrong-consumer.err
          grep -F "Target preserved:" ${{ runner.temp }}/macos-wrong-consumer.err
          test "$(readlink "$LEGACY_HOME/.claude/skills")" = "${{ runner.temp }}/macos-ext-consumer"

      - name: macOS CLI smoke - Global and project instructions safety (Phase 5 Invariants)
        run: |
          WS=${{ runner.temp }}/macos-ws
          INST_HOME=${{ runner.temp }}/macos-inst-home
          mkdir -p "$INST_HOME/.claude" "$INST_HOME/.codex"
          mkdir -p ${{ runner.temp }}/macos-ext-inst
          ln -s "${{ runner.temp }}/macos-ext-inst" "$INST_HOME/.claude/CLAUDE.md"
          ! HOME="$INST_HOME" AIKITO_DIR=$WS python3 -m aikito sync global 2> ${{ runner.temp }}/macos-wrong-inst.err
          grep -F "[CONFLICT]" ${{ runner.temp }}/macos-wrong-inst.err
          test "$(readlink "$INST_HOME/.claude/CLAUDE.md")" = "${{ runner.temp }}/macos-ext-inst"

          # Project instructions empty canonical cleanup
          PROJ_DIR=${{ runner.temp }}/macos-inst-proj
          mkdir -p "$PROJ_DIR/.claude"
          AIKITO_DIR=$WS python3 -m aikito init project macos-inst "$PROJ_DIR"
          printf "# Mac Instructions\n" > "$WS/projects/macos-inst/AGENTS.md"
          AIKITO_DIR=$WS python3 -m aikito sync project macos-inst
          test -L "$PROJ_DIR/AGENTS.md"
          test -L "$PROJ_DIR/.claude/CLAUDE.md"

          # Empty canonical cleanup (INV-INST-08)
          printf "" > "$WS/projects/macos-inst/AGENTS.md"
          AIKITO_DIR=$WS python3 -m aikito sync project macos-inst
          test ! -e "$PROJ_DIR/AGENTS.md"
          test ! -e "$PROJ_DIR/.claude/CLAUDE.md"

          # Project-owned regular file at instruction target is preserved under empty canonical (INV-INST-10)
          printf "project-owned instruction content\n" > "$PROJ_DIR/AGENTS.md"
          AIKITO_DIR=$WS python3 -m aikito sync project macos-inst
          test -f "$PROJ_DIR/AGENTS.md"
          test ! -L "$PROJ_DIR/AGENTS.md"
          test "$(cat "$PROJ_DIR/AGENTS.md")" = "project-owned instruction content"

          # Regular file at instruction target causes conflict when canonical is enabled (INV-INST-03)
          printf "# Enabled Instructions\n" > "$WS/projects/macos-inst/AGENTS.md"
          ! AIKITO_DIR=$WS python3 -m aikito sync project macos-inst 2> ${{ runner.temp }}/macos-reg-inst-conflict.err
          grep -F "[CONFLICT]" ${{ runner.temp }}/macos-reg-inst-conflict.err
          test -f "$PROJ_DIR/AGENTS.md"
          test ! -L "$PROJ_DIR/AGENTS.md"
          test "$(cat "$PROJ_DIR/AGENTS.md")" = "project-owned instruction content"
          rm -rf "$PROJ_DIR" "$WS/projects/macos-inst"

      - name: macOS CLI smoke - Link and Copy Modes
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_LINK=${{ runner.temp }}/macos-proj-link
          PROJ_COPY=${{ runner.temp }}/macos-proj-copy
          mkdir -p "$PROJ_LINK" "$PROJ_COPY"

          AIKITO_DIR=$WS python3 -m aikito init workspace "$WS"
          AIKITO_DIR=$WS python3 -m aikito init project demo-link "$PROJ_LINK"
          AIKITO_DIR=$WS python3 -m aikito init project demo-copy "$PROJ_COPY"

          # Add link skill
          AIKITO_DIR=$WS python3 -m aikito add skill test-link-skill --description "Link skill"
          printf "canonical link content\n" > "$WS/skills/test-link-skill/SKILL.md"

          # Add copy skill
          AIKITO_DIR=$WS python3 -m aikito add skill test-copy-skill --description "Copy skill"
          printf "canonical copy content\n" > "$WS/skills/test-copy-skill/SKILL.md"
          printf "extra copy file\n" > "$WS/skills/test-copy-skill/extra.txt"

          # Configure demo-link for link mode
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace('skills = []', 'skills = [\"test-link-skill\"]'))
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          test -L "$PROJ_LINK/.agents/skills/test-link-skill"
          test -f "$PROJ_LINK/.agents/skills/test-link-skill/SKILL.md"
          python3 -c "
          import os, sys
          from pathlib import Path
          link = Path('$PROJ_LINK/.agents/skills/test-link-skill')
          canonical = Path('$WS/skills/test-link-skill')
          assert link.resolve() == canonical.resolve(), f'{link.resolve()} != {canonical.resolve()}'
          assert (link / 'SKILL.md').read_text() == 'canonical link content\n'
          "

          # Configure demo-copy for copy mode
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-copy/agent.toml')
          content = p.read_text().replace('sync_mode = \"link\"', 'sync_mode = \"copy\"').replace('skills = []', 'skills = [\"test-copy-skill\"]')
          p.write_text(content)
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy
          test -d "$PROJ_COPY/.agents/skills/test-copy-skill"
          test -f "$PROJ_COPY/.agents/skills/test-copy-skill/SKILL.md"
          test -f "$PROJ_COPY/.agents/skills/test-copy-skill/extra.txt"
          ! test -L "$PROJ_COPY/.agents/skills/test-copy-skill"
          diff -r "$WS/skills/test-copy-skill" "$PROJ_COPY/.agents/skills/test-copy-skill"

      - name: macOS CLI smoke - Broken Symlink Handling
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_LINK=${{ runner.temp }}/macos-proj-link

          # 1. Managed broken link: canonical deleted while skill deselected
          mkdir -p "$WS/skills/temp-broken-skill"
          printf "temp\n" > "$WS/skills/temp-broken-skill/SKILL.md"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace('skills = [\"test-link-skill\"]', 'skills = [\"test-link-skill\", \"temp-broken-skill\"]'))
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          test -L "$PROJ_LINK/.agents/skills/temp-broken-skill"

          # Now delete canonical source to break the link
          rm -rf "$WS/skills/temp-broken-skill"
          test -L "$PROJ_LINK/.agents/skills/temp-broken-skill"
          test ! -e "$PROJ_LINK/.agents/skills/temp-broken-skill"

          # Deselect temp-broken-skill
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace(', \"temp-broken-skill\"', ''))
          "

          # Dry-run preview should report cleanup without deleting
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link --dry-run | tee ${{ runner.temp }}/broken-preview.out
          grep -F "[DRY RUN CLEANUP]" ${{ runner.temp }}/broken-preview.out
          test -L "$PROJ_LINK/.agents/skills/temp-broken-skill"

          # Real sync cleans up managed broken link
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          test ! -L "$PROJ_LINK/.agents/skills/temp-broken-skill"

          # 2. External broken link: unmanaged broken link must be preserved
          ln -s /tmp/nonexistent-external-path-xyz "$PROJ_LINK/.agents/skills/external-broken"
          test -L "$PROJ_LINK/.agents/skills/external-broken"
          test ! -e "$PROJ_LINK/.agents/skills/external-broken"
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          test -L "$PROJ_LINK/.agents/skills/external-broken"
          rm "$PROJ_LINK/.agents/skills/external-broken"

      - name: macOS CLI smoke - Wrong Target Symlink and External Directories
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_LINK=${{ runner.temp }}/macos-proj-link
          EXT_DIR=${{ runner.temp }}/macos-external-res
          mkdir -p "$EXT_DIR"
          printf "sentinel external data\n" > "$EXT_DIR/sentinel.txt"

          # Wrong target symlink: selected skill points to external resource
          mkdir -p "$WS/skills/wrong-link-skill"
          printf "canonical wrong link\n" > "$WS/skills/wrong-link-skill/SKILL.md"
          ln -s "$EXT_DIR" "$PROJ_LINK/.agents/skills/wrong-link-skill"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace('skills = [\"test-link-skill\"]', 'skills = [\"test-link-skill\", \"wrong-link-skill\"]'))
          "
          # Sync must fail (non-zero exit)
          if AIKITO_DIR=$WS python3 -m aikito sync project demo-link 2>${{ runner.temp }}/wrong-link.err; then
            echo "Expected sync project to fail on external symlink conflict"
            exit 1
          fi
          test -L "$PROJ_LINK/.agents/skills/wrong-link-skill"
          test -f "$EXT_DIR/sentinel.txt"
          rm "$PROJ_LINK/.agents/skills/wrong-link-skill"
          rm -rf "$WS/skills/wrong-link-skill"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace(', \"wrong-link-skill\"', ''))
          "

          # External regular directory:
          # Deselected external directory with sentinel file must be preserved
          mkdir -p "$PROJ_LINK/.agents/skills/local-custom-dir"
          printf "local sentinel\n" > "$PROJ_LINK/.agents/skills/local-custom-dir/sentinel.txt"
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          test -d "$PROJ_LINK/.agents/skills/local-custom-dir"
          test -f "$PROJ_LINK/.agents/skills/local-custom-dir/sentinel.txt"

          # When selected in link mode, existing non-matching directory causes conflict
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace('skills = [\"test-link-skill\"]', 'skills = [\"test-link-skill\", \"local-custom-dir\"]'))
          "
          mkdir -p "$WS/skills/local-custom-dir"
          printf "workspace different content\n" > "$WS/skills/local-custom-dir/SKILL.md"
          if AIKITO_DIR=$WS python3 -m aikito sync project demo-link 2>${{ runner.temp }}/ext-dir.err; then
            echo "Expected sync project to fail on external directory conflict"
            exit 1
          fi
          test -f "$PROJ_LINK/.agents/skills/local-custom-dir/sentinel.txt"

          # Restore clean config
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace(', \"local-custom-dir\"', ''))
          "
          rm -rf "$PROJ_LINK/.agents/skills/local-custom-dir"
          rm -rf "$WS/skills/local-custom-dir"

      - name: macOS CLI smoke - Deselection Semantics (Link Cleaned, Copy Preserved)
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_LINK=${{ runner.temp }}/macos-proj-link
          PROJ_COPY=${{ runner.temp }}/macos-proj-copy

          # Deselect managed link: link is removed
          test -L "$PROJ_LINK/.agents/skills/test-link-skill"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-link/agent.toml')
          p.write_text(p.read_text().replace('skills = [\"test-link-skill\"]', 'skills = []'))
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          test ! -L "$PROJ_LINK/.agents/skills/test-link-skill"

          # Deselect unmodified copy: copy is preserved even if identical to canonical
          test -d "$PROJ_COPY/.agents/skills/test-copy-skill"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-copy/agent.toml')
          p.write_text(p.read_text().replace('skills = [\"test-copy-skill\"]', 'skills = []'))
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy
          test -d "$PROJ_COPY/.agents/skills/test-copy-skill"
          test -f "$PROJ_COPY/.agents/skills/test-copy-skill/SKILL.md"
          test -f "$PROJ_COPY/.agents/skills/test-copy-skill/extra.txt"

      - name: macOS CLI smoke - Repeated Sync Invariance (Zero-Write Invariance)
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_LINK=${{ runner.temp }}/macos-proj-link
          PROJ_COPY=${{ runner.temp }}/macos-proj-copy

          # Restore skills in config
          python3 -c "
          from pathlib import Path
          p_link = Path('$WS/projects/demo-link/agent.toml')
          p_link.write_text(p_link.read_text().replace('skills = []', 'skills = [\"test-link-skill\"]'))
          p_copy = Path('$WS/projects/demo-copy/agent.toml')
          p_copy.write_text(p_copy.read_text().replace('skills = []', 'skills = [\"test-copy-skill\"]'))
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy --force

          # Capture first sync metadata (mtime, inode, readlink) using Python standard library
          python3 -c "
          import os, json
          from pathlib import Path

          def capture_meta(root):
              meta = {}
              for p in sorted(root.rglob('*')):
                  st = p.lstat()
                  target = os.readlink(p) if p.is_symlink() else None
                  meta[str(p.relative_to(root))] = {
                      'is_symlink': p.is_symlink(),
                      'is_dir': p.is_dir() and not p.is_symlink(),
                      'mtime_ns': st.st_mtime_ns,
                      'ino': st.st_ino,
                      'link_target': target,
                  }
              return meta

          meta_link = capture_meta(Path('$PROJ_LINK'))
          meta_copy = capture_meta(Path('$PROJ_COPY'))
          Path('${{ runner.temp }}/meta_before.json').write_text(json.dumps({'link': meta_link, 'copy': meta_copy}, indent=2))
          "

          # Repeat sync
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy

          # Assert content and link semantics are valid and verify zero-write invariance
          python3 -c "
          import os, json
          from pathlib import Path

          before = json.loads(Path('${{ runner.temp }}/meta_before.json').read_text())
          link_skill = Path('$PROJ_LINK/.agents/skills/test-link-skill')
          copy_skill = Path('$PROJ_COPY/.agents/skills/test-copy-skill')

          assert link_skill.is_symlink(), 'Link skill should remain symlink'
          assert (link_skill / 'SKILL.md').read_text() == 'canonical link content\n'
          assert copy_skill.is_dir() and not copy_skill.is_symlink(), 'Copy skill should remain directory'
          assert (copy_skill / 'SKILL.md').read_text() == 'canonical copy content\n'

          # Zero-write assertion: directory and child mtime must be invariant
          st_copy = copy_skill.lstat()
          assert st_copy.st_mtime_ns == before['copy']['.agents/skills/test-copy-skill']['mtime_ns'], (
              f'Copy skill was unexpectedly re-written: before={before[\"copy\"][\".agents/skills/test-copy-skill\"][\"mtime_ns\"]} after={st_copy.st_mtime_ns}'
          )
          assert (copy_skill / 'SKILL.md').lstat().st_mtime_ns == before['copy']['.agents/skills/test-copy-skill/SKILL.md']['mtime_ns'], (
              'Copy skill child file was unexpectedly re-written'
          )
          print('[SUCCESS] Zero-write repeat sync verified')
          "

      - name: macOS CLI smoke - Drift vs Update, Force Overwrite, and Deselection
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_COPY=${{ runner.temp }}/macos-proj-copy
          copy_skill="$PROJ_COPY/.agents/skills/test-copy-skill"

          # 1. Upstream update without --force (R == B != C)
          printf "canonical copy updated v2\n" > "$WS/skills/test-copy-skill/SKILL.md"
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy
          grep -F "canonical copy updated v2" "$copy_skill/SKILL.md"

          # 2. Local drift conflict (R != B != C)
          printf "local modified content\n" > "$copy_skill/SKILL.md"
          if AIKITO_DIR=$WS python3 -m aikito sync project demo-copy 2>${{ runner.temp }}/macos-drift.err; then
            echo "Expected sync project to fail on local drift"
            exit 1
          fi
          grep -F "drifted" ${{ runner.temp }}/macos-drift.err

          # 3. Overwrite drift with --force
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy --force
          grep -F "canonical copy updated v2" "$copy_skill/SKILL.md"

          # 4. Deselection preservation (aikito rm skill --project preserves files on disk)
          AIKITO_DIR=$WS python3 -m aikito rm skill test-copy-skill --project demo-copy
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy
          test -d "$copy_skill"
          test -f "$copy_skill/SKILL.md"
          grep -F "canonical copy updated v2" "$copy_skill/SKILL.md"

          # 5. Restore original state for subsequent dry-run smoke test
          printf "canonical copy content\n" > "$WS/skills/test-copy-skill/SKILL.md"
          AIKITO_DIR=$WS python3 -m aikito add skill test-copy-skill --project demo-copy
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy --force
          grep -F "canonical copy content" "$copy_skill/SKILL.md"

      - name: macOS CLI smoke - Project Memory Runtime, Idempotency, and Conflict Protection (Phase 6)
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_MEM=${{ runner.temp }}/macos-proj-mem
          mkdir -p "$PROJ_MEM"
          AIKITO_DIR=$WS python3 -m aikito init project demo-mem "$PROJ_MEM"
          mkdir -p "$WS/projects/demo-mem/memory/notes"
          mkdir -p "$WS/memory"
          printf "# Global Reference\n" > "$WS/memory/shared.md"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-mem/agent.toml')
          p.write_text(p.read_text() + '\nmemory = [\"shared.md\"]\n')
          "

          # 1. Project sync creates canonical memory symlinks (INV-MEM-01, INV-MEM-03)
          AIKITO_DIR=$WS python3 -m aikito sync project demo-mem
          test -L "$PROJ_MEM/.agents/memory/notes"
          test -L "$PROJ_MEM/.agents/memory/shared.md"

          # 2. Repeated sync is NOOP (INV-MEM-10)
          OUT=$(AIKITO_DIR=$WS python3 -m aikito sync project demo-mem)
          if echo "$OUT" | grep -q "\[LINK\]"; then exit 1; fi
          if echo "$OUT" | grep -q "\[UNLINK\]"; then exit 1; fi

          # 3. Target conflict protection preserves existing regular files (INV-MEM-07)
          rm "$PROJ_MEM/.agents/memory/shared.md"
          printf "unmanaged regular file\n" > "$PROJ_MEM/.agents/memory/shared.md"
          if AIKITO_DIR=$WS python3 -m aikito sync project demo-mem 2> ${{ runner.temp }}/macos-mem-conflict.err; then
            echo "Expected sync project to fail on regular file conflict"
            exit 1
          fi
          grep -F "[CONFLICT]" ${{ runner.temp }}/macos-mem-conflict.err
          test -f "$PROJ_MEM/.agents/memory/shared.md"
          test ! -L "$PROJ_MEM/.agents/memory/shared.md"
          test "$(cat "$PROJ_MEM/.agents/memory/shared.md")" = "unmanaged regular file"

          # 4. Deselection unlinks exact owned link (INV-MEM-06)
          rm "$PROJ_MEM/.agents/memory/shared.md"
          AIKITO_DIR=$WS python3 -m aikito sync project demo-mem
          test -L "$PROJ_MEM/.agents/memory/shared.md"
          python3 -c "
          from pathlib import Path
          p = Path('$WS/projects/demo-mem/agent.toml')
          p.write_text(p.read_text().replace('\"shared.md\"', ''))
          "
          AIKITO_DIR=$WS python3 -m aikito sync project demo-mem | tee ${{ runner.temp }}/macos-mem-desel.out
          grep -F "[CLEANUP]" ${{ runner.temp }}/macos-mem-desel.out
          test ! -e "$PROJ_MEM/.agents/memory/shared.md"
          test -L "$PROJ_MEM/.agents/memory/notes"

          rm -rf "$PROJ_MEM" "$WS/projects/demo-mem"

      - name: macOS CLI smoke - Dry Run Non-Mutation Guarantee
        run: |
          WS=${{ runner.temp }}/macos-ws
          PROJ_LINK=${{ runner.temp }}/macos-proj-link
          PROJ_COPY=${{ runner.temp }}/macos-proj-copy
          EXT_DIR=${{ runner.temp }}/macos-external-res

          # Take pre-snapshot across isolated home, workspace, projects, and external directory
          python3 -c "
          import os, json
          from pathlib import Path

          def snapshot(roots):
              tree = {}
              for root in roots:
                  r = Path(root)
                  if not r.exists():
                      continue
                  for p in sorted(r.rglob('*')):
                      st = p.lstat()
                      target = os.readlink(p) if p.is_symlink() else None
                      content = p.read_bytes() if p.is_file() and not p.is_symlink() else None
                      tree[str(p)] = {
                          'is_symlink': p.is_symlink(),
                          'is_dir': p.is_dir() and not p.is_symlink(),
                          'is_file': p.is_file() and not p.is_symlink(),
                          'target': target,
                          'size': st.st_size,
                          'content': content.hex() if content else None,
                      }
              return tree

          snap = snapshot([os.environ['HOME'], '$WS', '$PROJ_LINK', '$PROJ_COPY', '$EXT_DIR'])
          Path('${{ runner.temp }}/dryrun_snap_before.json').write_text(json.dumps(snap))
          "

          # Execute dry-runs
          AIKITO_DIR=$WS python3 -m aikito sync --dry-run
          AIKITO_DIR=$WS python3 -m aikito sync project demo-link --dry-run
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy --dry-run

          # Verify post-snapshot matches pre-snapshot exactly
          python3 -c "
          import os, json
          from pathlib import Path

          def snapshot(roots):
              tree = {}
              for root in roots:
                  r = Path(root)
                  if not r.exists():
                      continue
                  for p in sorted(r.rglob('*')):
                      st = p.lstat()
                      target = os.readlink(p) if p.is_symlink() else None
                      content = p.read_bytes() if p.is_file() and not p.is_symlink() else None
                      tree[str(p)] = {
                          'is_symlink': p.is_symlink(),
                          'is_dir': p.is_dir() and not p.is_symlink(),
                          'is_file': p.is_file() and not p.is_symlink(),
                          'target': target,
                          'size': st.st_size,
                          'content': content.hex() if content else None,
                      }
              return tree

          before = json.loads(Path('${{ runner.temp }}/dryrun_snap_before.json').read_text())
          after = snapshot([os.environ['HOME'], '$WS', '$PROJ_LINK', '$PROJ_COPY', '$EXT_DIR'])
          assert before == after, 'Dry-run modified the filesystem tree!'
          print('[SUCCESS] Dry run snapshot verified: zero mutations')
          "

      - name: macOS CLI smoke - Subagents and MCP Configuration Safety and Lifecycle (Phase 7)
        run: |
          WS=${{ runner.temp }}/macos-ws

          # 1. Subagent sync and repeat NOOP (INV-CFG-01, INV-SUB-01)
          AIKITO_DIR=$WS python3 -m aikito add subagent macos-sub --description "macOS test subagent"
          test -f "$WS/subagents/macos-sub.md"
          AIKITO_DIR=$WS python3 -m aikito sync subagents | tee ${{ runner.temp }}/macos-sub-apply.out
          test -f ~/.claude/agents/macos-sub.md
          grep -q 'generated by aikito from subagents/macos-sub.md' ~/.claude/agents/macos-sub.md

          # Repeat sync NOOP idempotency
          AIKITO_DIR=$WS python3 -m aikito sync subagents | tee ${{ runner.temp }}/macos-sub-repeat.out
          grep -F "[OK] claude-code/macos-sub" ${{ runner.temp }}/macos-sub-repeat.out

          # 2. MCP sync and repeat NOOP (INV-CFG-01, INV-MCP-01)
          AIKITO_DIR=$WS python3 -m aikito add mcp macos-mcp --url "https://example.com/macos-mcp"
          test -f "$WS/mcps/macos-mcp.toml"
          AIKITO_DIR=$WS python3 -m aikito sync mcp | tee ${{ runner.temp }}/macos-mcp-apply.out
          grep -q "macos_mcp" ~/.codex/config.toml
          test -f ~/.local/state/aikito/mcp-state.json

          # Repeat sync NOOP idempotency
          AIKITO_DIR=$WS python3 -m aikito sync mcp | tee ${{ runner.temp }}/macos-mcp-repeat.out
          grep -q "already synchronized" ${{ runner.temp }}/macos-mcp-repeat.out

          # 3. Runtime drift blocks without --force (INV-MCP-01)
          python3 -c "
          from pathlib import Path
          p = Path.home() / '.codex/config.toml'
          p.write_text(p.read_text().replace('https://example.com/macos-mcp', 'https://example.com/drifted'))
          "
          if AIKITO_DIR=$WS python3 -m aikito sync mcp > ${{ runner.temp }}/macos-mcp-drift.out 2>&1; then
            echo "Expected MCP sync to fail on runtime drift"
            exit 1
          fi
          grep -F "[CONFLICT]" ${{ runner.temp }}/macos-mcp-drift.out

          # 4. MCP Desired Absent removal via unified engine (INV-MCP-07)
          AIKITO_DIR=$WS python3 -m aikito rm mcp macos-mcp --force --sync
          test ! -e "$WS/mcps/macos-mcp.toml"
          ! grep -q "macos_mcp" ~/.codex/config.toml

          # Cleanup subagent
          AIKITO_DIR=$WS python3 -m aikito rm subagent macos-sub --sync
          test ! -e ~/.claude/agents/macos-sub.md

      - name: macOS CLI smoke - Workspace public API and unified coordination (Phase 8)
        run: |
          WS=${{ runner.temp }}/macos-ws
          AIKITO_DIR=$WS python3 -c "
          from aikito import Workspace, WorkspaceNotFoundError, InvalidWorkspaceError
          import tempfile
          from pathlib import Path

          ws = Workspace.load('$WS')
          assert ws.path.resolve() == Path('$WS').resolve()
          inspection = ws.inspect()
          assert inspection.workspace_dir.resolve() == ws.path.resolve()
          assert isinstance(inspection.projects, tuple)

          preview = ws.plan_sync()
          assert preview.workspace_path.resolve() == Path('$WS').resolve()
          assert isinstance(preview.can_apply, bool)

          try:
              Workspace.load('/nonexistent/path/to/ws')
              raise AssertionError('Expected WorkspaceNotFoundError')
          except WorkspaceNotFoundError:
              pass

          try:
              Workspace.load('relative/path/to/ws')
              raise AssertionError('Expected InvalidWorkspaceError')
          except InvalidWorkspaceError:
              pass
          "

      - name: macOS CLI smoke - CWD-centric interaction
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          WS=${{ runner.temp }}/macos-ws
          CWD_PROJ=${{ runner.temp }}/cwd-test-proj
          OTHER_PROJ=${{ runner.temp }}/other-test-proj
          mkdir -p "$CWD_PROJ" "$OTHER_PROJ"
          AIKITO_DIR="$WS" python3 -m aikito init project cwd-proj "$CWD_PROJ"
          AIKITO_DIR="$WS" python3 -m aikito init project other-proj "$OTHER_PROJ"

          # 1. sync project inside project directory without project_name
          (
            cd "$CWD_PROJ"
            AIKITO_DIR="$WS" python3 -m aikito sync project | tee ${{ runner.temp }}/cwd-sync.out
            grep -F "[aikito] Target project: 'cwd-proj' (detected from cwd)" ${{ runner.temp }}/cwd-sync.out
          )

          # 2. show project and show project . inside project directory
          (
            cd "$CWD_PROJ"
            AIKITO_DIR="$WS" python3 -m aikito show project | tee ${{ runner.temp }}/cwd-show.out
            grep -F "[aikito] Target project: 'cwd-proj' (detected from cwd)" ${{ runner.temp }}/cwd-show.out
            grep -E "Project:\s+cwd-proj" ${{ runner.temp }}/cwd-show.out

            AIKITO_DIR="$WS" python3 -m aikito show project . | tee ${{ runner.temp }}/cwd-show-dot.out
            grep -E "Project:\s+cwd-proj" ${{ runner.temp }}/cwd-show-dot.out
          )

          # 3. diff inside project directory scopes to project, and diff --all includes all projects
          PROJ_COPY=${{ runner.temp }}/macos-proj-copy
          printf "drift in demo-copy\n" > "$PROJ_COPY/.agents/skills/test-copy-skill/SKILL.md"
          (
            cd "$CWD_PROJ"
            AIKITO_DIR="$WS" python3 -m aikito diff | tee ${{ runner.temp }}/cwd-diff.out
            grep -F "[aikito] Target project: 'cwd-proj' (detected from cwd)" ${{ runner.temp }}/cwd-diff.out
            ! grep -F "test-copy-skill" ${{ runner.temp }}/cwd-diff.out

            AIKITO_DIR="$WS" python3 -m aikito diff --all | tee ${{ runner.temp }}/cwd-diff-all.out
            grep -F "test-copy-skill" ${{ runner.temp }}/cwd-diff-all.out
            grep -F "drift in demo-copy" ${{ runner.temp }}/cwd-diff-all.out
          )
          AIKITO_DIR=$WS python3 -m aikito sync project demo-copy --force

          # 4. show memory inside project directory scopes to project + global, and --all includes other projects
          mkdir -p "$WS/memory/notes"
          echo "# Smoke Global Note" > "$WS/memory/notes/smoke-global-note.md"
          echo "# Smoke Other Project Note" > "$WS/projects/other-proj/memory/notes/smoke-other-note.md"
          echo "# Smoke CWD Project Note" > "$WS/projects/cwd-proj/memory/notes/smoke-cwd-note.md"
          (
            cd "$CWD_PROJ"
            AIKITO_DIR="$WS" python3 -m aikito show memory | tee ${{ runner.temp }}/cwd-mem.out
            grep -F "[aikito] Target project: 'cwd-proj' (detected from cwd)" ${{ runner.temp }}/cwd-mem.out
            grep -F "smoke-cwd-note" ${{ runner.temp }}/cwd-mem.out
            grep -F "smoke-global-note" ${{ runner.temp }}/cwd-mem.out
            ! grep -F "smoke-other-note" ${{ runner.temp }}/cwd-mem.out

            AIKITO_DIR="$WS" python3 -m aikito show memory --all | tee ${{ runner.temp }}/cwd-mem-all.out
            grep -F "smoke-cwd-note" ${{ runner.temp }}/cwd-mem-all.out
            grep -F "smoke-global-note" ${{ runner.temp }}/cwd-mem-all.out
            grep -F "smoke-other-note" ${{ runner.temp }}/cwd-mem-all.out
          )

          # 5. add skill inside project directory defaults to current project; --global adds globally without project registration
          (
            cd "$CWD_PROJ"
            AIKITO_DIR="$WS" python3 -m aikito add skill cwd-skill --description "CWD test skill" | tee ${{ runner.temp }}/cwd-skill.out
            grep -F "[aikito] Target project: 'cwd-proj' (detected from cwd)" ${{ runner.temp }}/cwd-skill.out
            test -f "$WS/skills/cwd-skill/SKILL.md"
            grep -q 'cwd-skill' "$WS/projects/cwd-proj/agent.toml"

            AIKITO_DIR="$WS" python3 -m aikito add skill global-skill --global --description "Global test skill" | tee ${{ runner.temp }}/global-skill.out
            ! grep -F "[aikito] Target project: 'cwd-proj'" ${{ runner.temp }}/global-skill.out
            test -f "$WS/skills/global-skill/SKILL.md"
            ! grep -q 'global-skill' "$WS/projects/cwd-proj/agent.toml"
          )

          # 6. edit instructions without arguments: resolves to project inside cwd, falls back to global outside
          (
            cd "$CWD_PROJ"
            EDITOR="python3 -c \"import sys, pathlib; pathlib.Path('${{ runner.temp }}/edited-proj.out').write_text(sys.argv[1])\"" \
              AIKITO_DIR="$WS" python3 -m aikito edit instructions | tee ${{ runner.temp }}/cwd-edit.out
            grep -F "[aikito] Target project: 'cwd-proj' (detected from cwd)" ${{ runner.temp }}/cwd-edit.out
            grep -F "$WS/projects/cwd-proj/AGENTS.md" ${{ runner.temp }}/edited-proj.out
          )
          (
            cd ${{ runner.temp }}
            EDITOR="python3 -c \"import sys, pathlib; pathlib.Path('${{ runner.temp }}/edited-global.out').write_text(sys.argv[1])\"" \
              AIKITO_DIR="$WS" python3 -m aikito edit instructions | tee ${{ runner.temp }}/outside-edit.out
            ! grep -F "[aikito] Target project:" ${{ runner.temp }}/outside-edit.out
            grep -F "$WS/global/AGENTS.md" ${{ runner.temp }}/edited-global.out
          )

          # 7. Outside project directory: sync project without name fails
          (
            cd ${{ runner.temp }}
            ! AIKITO_DIR="$WS" python3 -m aikito sync project 2> ${{ runner.temp }}/outside-sync.err
            grep -F "Current directory is not inside a registered project" ${{ runner.temp }}/outside-sync.err
          )

          rm -rf "$CWD_PROJ" "$OTHER_PROJ" "$WS/projects/cwd-proj" "$WS/projects/other-proj" \
            "$WS/skills/cwd-skill" "$WS/skills/global-skill" "$WS/memory/notes/smoke-global-note.md"

