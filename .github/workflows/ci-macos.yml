name: macOS CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  macos-smoke-test:
    runs-on: macos-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv pip install --system pytest pytest-xdist '.[encrypted]'

      - name: Run macOS platform and CLI unit tests
        run: python -m pytest -n auto tests/test_compat.py tests/test_cli.py tests/test_workspace_native_keys.py tests/test_remote_key_cli.py

      - name: Set isolated HOME for smoke tests
        run: |
          mkdir -p "${{ runner.temp }}/macos-home"
          echo "HOME=${{ runner.temp }}/macos-home" >> "$GITHUB_ENV"

      - name: Native key storage and explicit recovery CLI smoke
        run: |
          NATIVE_SMOKE=${{ runner.temp }}/native-key-check
          python3 tests/workspace_native_key_smoke.py "$NATIVE_SMOKE"

      - name: End-to-end CLI workflow suite on macOS
        run: python3 -m pytest -m smoke tests/test_cli_workflow_e2e.py
