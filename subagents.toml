# Verifier must run with isolated context and not inherit parent conversation history.
# Invocation context is controlled by the caller and cannot be expressed here.
[subagents.verifier]
description = "Runs project-approved formatting, lint-fix, and test operations."
agents = ["codex", "claude-code", "github-copilot", "agy", "dsh"]

[subagents.verifier.codex]
model = "gpt-5.4-mini"
model_reasoning_effort = "low"

[subagents.verifier.claude-code]
model = "haiku"
effort = "low"

[subagents.verifier.agy]
tools = ["run_command"]

[subagents.verifier.github-copilot]
tools = ["read", "search", "edit", "execute"]

