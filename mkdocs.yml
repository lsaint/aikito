site_name: Aikito
site_description: Govern AI-agent context and durable memory from one Git-managed workspace.
site_url: https://lsaint.github.io/aikito/
repo_url: https://github.com/lsaint/aikito
repo_name: lsaint/aikito
edit_uri: edit/main/docs/
copyright: 'Copyright &copy; 2026 · <strong><a href="https://github.com/lsaint/" target="_blank" rel="noopener">Ethan St Lee</a></strong> · MIT licensed'

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-dark.png
  favicon: assets/logo-light.png
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Documentation: guide.md
  - Get Started:
      - 1. Install Aikito: installation.md
      - 2. Adopt Your Existing Setup: workspace-setup.md
      - 3. Synchronize and Verify: sync-existing-setup.md
      - 4. Connect a Project: project-setup.md
  - Everyday Tasks:
      - Add or Import a Skill: skills.md
      - Manage Instructions and Rules: instructions.md
      - Durable Memory: durable-memory.md
      - MCP Servers: mcp-servers.md
      - Subagents: subagents.md
      - Inbox: inbox.md
      - Chat Distiller: chat-distiller.md
      - Agent Request Examples: agent-workflow.md
  - Maintenance & Advanced:
      - Check and Repair Synchronization: troubleshooting.md
      - Advanced Project Setup: project-configuration.md
      - Connect Another Machine: workspace-portability.md
  - Core Concepts:
      - Workspace and Synchronization: architecture.md
      - Memory Scope and Lifecycle: memory-workflow.md
  - Reference:
      - CLI Reference: cli-reference.md
      - Python API Reference: python-api.md
      - Safety Model: safety.md
  - About:
      - Comparison: comparison.md
      - Why Memory Needs a Maintainer: programming-agent-memory.md
      - Roadmap: roadmap.md
      - About: about.md
  - 中文:
      - Inbox: inbox.zh-CN.md
      - Memory 需要维护者: programming-agent-memory.zh-CN.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

exclude_docs: |
  overrides/

plugins:
  - search

extra_css:
  - stylesheets/fonts.css
  - stylesheets/modern.css

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
