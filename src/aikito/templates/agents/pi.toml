# =============================================================================
# Pi
# =============================================================================
# Pi natively discovers global skills in ~/.agents/skills and project skills in
# .agents/skills, which is exactly what aikito already manages.
# Pi natively supports MCP servers via ~/.pi/agent/mcp.json and project .pi/mcp.json.
# Aikito enables subagent synchronization only when the extension is installed.
[agents.pi]
display_name = "Pi"
instruction_path = ".pi/agent/AGENTS.md"
project_instruction_path = "AGENTS.md"
skills_path = ".agents/skills"

[agents.pi.detect]
commands = ["pi"]
paths = [".pi"]

[agents.pi.runner]
command = ["pi", "{prompt}"]
auto_approve_args = []

[agents.pi.subagents]
config_path = ".pi/agent/agents"
config_format = "pi_markdown"
requires_path = ".pi/agent/extensions/subagent/index.ts"

[agents.pi.mcp]
config_path = ".pi/agent/mcp.json"
config_format = "pi_json"
name_style = "verbatim"
live_command = ["pi", "mcp", "list"]
auth_command = ["pi", "mcp", "login", "{target}"]
